
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HABERİSTA — Güncel Haberler</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#17202d;
}

/* HEADER */

header{
    background:#ffffff;
    border-bottom:1px solid #e5e9ef;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-top{
    max-width:1250px;
    height:78px;
    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

/* LOGO */

.logo{
    font-size:31px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#17202d;
    cursor:pointer;
    white-space:nowrap;
}

.logo span{
    color:#4f8cff;
}

/* SEARCH */

.search{
    width:330px;
    height:43px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#f7f9fb;
    border:1px solid #e0e6ed;
    border-radius:12px;
}

.search-icon{
    margin-right:9px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    font-size:14px;
}

/* NAV */

.nav{
    border-top:1px solid #f0f2f5;
    background:#fff;
}

.nav-inner{
    max-width:1250px;
    margin:auto;

    display:flex;
    gap:7px;

    padding:11px 20px;

    overflow-x:auto;
}

.nav button{
    border:0;
    background:#f2f5f8;

    color:#475467;

    padding:10px 17px;

    border-radius:9px;

    font-weight:700;

    cursor:pointer;

    white-space:nowrap;

    transition:.2s;
}

.nav button:hover,
.nav button.active{
    background:#4f8cff;
    color:white;
}

/* MAIN */

.container{
    max-width:1250px;
    margin:32px auto;
    padding:0 20px;
}

/* TITLE */

.section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin-bottom:18px;
}

.section-title h1{
    font-size:26px;
}

.section-title p{
    color:#8994a3;
    font-size:14px;
}

/* HERO */

.hero{
    display:grid;
    grid-template-columns:1.7fr 1fr;
    gap:20px;

    margin-bottom:38px;
}

.hero-main{
    height:440px;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    background:#ddd;

    cursor:pointer;
}

.hero-main img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;
}

.hero-main:hover img{
    transform:scale(1.04);
}

.hero-overlay{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:35px;

    color:white;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );
}

.badge{
    display:inline-block;

    background:#4f8cff;

    color:white;

    padding:7px 11px;

    border-radius:7px;

    font-size:12px;

    font-weight:800;

    margin-bottom:10px;
}

.hero-overlay h2{
    font-size:35px;
    line-height:1.12;

    margin-bottom:10px;
}

.hero-overlay p{
    line-height:1.5;
    opacity:.92;
}

/* SIDE NEWS */

.side-news{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.side-card{
    background:white;

    border:1px solid #e5e9ef;

    border-radius:15px;

    padding:12px;

    display:flex;

    gap:13px;

    cursor:pointer;

    transition:.2s;
}

.side-card:hover{
    transform:translateY(-2px);

    box-shadow:
    0 10px 28px
    rgba(20,40,70,.08);
}

.side-card img{
    width:125px;
    height:100px;

    object-fit:cover;

    border-radius:10px;

    flex-shrink:0;
}

.side-card small{
    color:#8a94a3;
}

.side-card h3{
    font-size:16px;
    line-height:1.3;

    margin:7px 0;
}

/* NEWS GRID */

.news-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;
}

.news-card{
    background:white;

    border:1px solid #e5e9ef;

    border-radius:16px;

    overflow:hidden;

    cursor:pointer;

    transition:.25s;
}

.news-card:hover{
    transform:translateY(-4px);

    box-shadow:
    0 12px 30px
    rgba(20,40,70,.09);
}

.news-card img{
    width:100%;
    height:210px;

    object-fit:cover;
}

.news-content{
    padding:17px;
}

.news-category{
    color:#4f8cff;

    font-size:12px;

    font-weight:800;

    text-transform:uppercase;
}

.news-card h3{
    font-size:19px;

    line-height:1.3;

    margin:8px 0;
}

.news-card p{
    color:#697586;

    font-size:14px;

    line-height:1.5;
}

.news-date{
    display:block;

    color:#98a2b3;

    font-size:12px;

    margin-top:13px;
}

/* EMPTY */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:60px 20px;

    color:#8a94a3;
}

/* FOOTER */

footer{
    margin-top:65px;

    padding:35px 20px;

    text-align:center;

    color:#8994a3;

    background:#fff;

    border-top:1px solid #e5e9ef;
}

.footer-logo{
    font-size:21px;
    font-weight:900;

    color:#17202d;

    margin-bottom:8px;
}

.footer-logo span{
    color:#4f8cff;
}

/* MOBILE */

@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
    }

    .news-grid{
        grid-template-columns:
        repeat(2,1fr);
    }

}

@media(max-width:650px){

    .header-top{
        height:auto;

        padding:15px;

        flex-direction:column;
    }

    .logo{
        font-size:29px;
    }

    .search{
        width:100%;
    }

    .hero-main{
        height:350px;
    }

    .hero-overlay{
        padding:22px;
    }

    .hero-overlay h2{
        font-size:26px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .side-card img{
        width:105px;
        height:90px;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="header-top">

        <div
            class="logo"
            onclick="window.location.href='index.html'">

            HABER<span>İSTA</span>

        </div>


        <div class="search">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="searchInput"
                type="text"
                placeholder="Haberlerde ara..."
            >

        </div>

    </div>


    <!-- KATEGORİLER -->

    <nav class="nav">

        <div class="nav-inner">

            <button
                class="active"
                data-category="Tümü">

                Tümü

            </button>

            <button
                data-category="Gündem">

                Gündem

            </button>

            <button
                data-category="Dünya">

                Dünya

            </button>

            <button
                data-category="Spor">

                Spor

            </button>

            <button
                data-category="Teknoloji">

                Teknoloji

            </button>

            <button
                data-category="Ekonomi">

                Ekonomi

            </button>

            <button
                data-category="Kültür">

                Kültür

            </button>

        </div>

    </nav>

</header>



<!-- ANA İÇERİK -->

<main class="container">


    <!-- MANŞET -->

    <section>

        <div class="section-title">

            <div>

                <h1>
                    Günün Öne Çıkanları
                </h1>

                <p>
                    HABERİSTA'dan günün önemli gelişmeleri
                </p>

            </div>

        </div>


        <div class="hero">

            <div id="heroMain"></div>

            <div
                class="side-news"
                id="sideNews">
            </div>

        </div>

    </section>



    <!-- HABERLER -->

    <section>

        <div class="section-title">

            <h1>
                Son Haberler
            </h1>

            <p id="resultCount"></p>

        </div>


        <div
            class="news-grid"
            id="newsGrid">
        </div>

    </section>

</main>



<!-- FOOTER -->

<footer>

    <div class="footer-logo">
        HABER<span>İSTA</span>
    </div>

    <div>
        Güncel haberlerin adresi
    </div>

</footer>



<!-- HABERLER -->

<script src="HABERLER/haberler.js"></script>


<script>

let aktifKategori = "Tümü";

let arama = "";



/* HABERLERİ AL */

function getNews(){

    if(
        typeof haberler ===
        "undefined"
    ){

        console.error(
            "HABERLER/haberler.js bulunamadı."
        );

        return [];

    }

    return haberler;

}



/* HABERİ AÇ */

function haberAc(id){

    window.location.href =
        "haber.html?id=" + id;

}



/* FİLTRELE */

function filtrele(){

    let sonuc =
        getNews();


    /* KATEGORİ */

    if(
        aktifKategori !==
        "Tümü"
    ){

        sonuc =
            sonuc.filter(
                haber =>
                haber.kategori ===
                aktifKategori
            );

    }


    /* ARAMA */

    if(
        arama.trim() !== ""
    ){

        const kelime =
            arama
            .toLocaleLowerCase(
                "tr-TR"
            );


        sonuc =
            sonuc.filter(
                haber =>

                haber.baslik
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(kelime)

                ||

                haber.aciklama
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .includes(kelime)

            );

    }


    render(sonuc);

}



/* SAYFAYI OLUŞTUR */

function render(liste){

    const hero =
        document.getElementById(
            "heroMain"
        );

    const side =
        document.getElementById(
            "sideNews"
        );

    const grid =
        document.getElementById(
            "newsGrid"
        );

    const count =
        document.getElementById(
            "resultCount"
        );


    hero.innerHTML = "";

    side.innerHTML = "";

    grid.innerHTML = "";


    count.textContent =
        liste.length +
        " haber";


    if(liste.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <h2>
                    Haber bulunamadı
                </h2>

                <p>
                    Arama veya kategori seçimini değiştirin.
                </p>

            </div>

        `;

        return;

    }



    /* MANŞET */

    const manset =
        liste[0];


    hero.innerHTML = `

        <div
            class="hero-main"
            onclick="haberAc(${manset.id})">

            <img
                src="${manset.gorsel}"
                alt="${manset.baslik}">

            <div class="hero-overlay">

                <span class="badge">
                    ${manset.kategori}
                </span>

                <h2>
                    ${manset.baslik}
                </h2>

                <p>
                    ${manset.aciklama}
                </p>

            </div>

        </div>

    `;



    /* YAN HABERLER */

    liste
    .slice(1,4)
    .forEach(
        haber => {

            side.innerHTML += `

                <div
                    class="side-card"
                    onclick="haberAc(${haber.id})">

                    <img
                        src="${haber.gorsel}"
                        alt="${haber.baslik}">

                    <div>

                        <small>
                            ${haber.kategori}
                        </small>

                        <h3>
                            ${haber.baslik}
                        </h3>

                        <small>
                            ${haber.tarih}
                        </small>

                    </div>

                </div>

            `;

        }
    );



    /* HABER KARTLARI */

    liste.forEach(
        haber => {

            grid.innerHTML += `

                <article
                    class="news-card"
                    onclick="haberAc(${haber.id})">

                    <img
                        src="${haber.gorsel}"
                        alt="${haber.baslik}">

                    <div class="news-content">

                        <div class="news-category">
                            ${haber.kategori}
                        </div>

                        <h3>
                            ${haber.baslik}
                        </h3>

                        <p>
                            ${haber.aciklama}
                        </p>

                        <span class="news-date">
                            ${haber.tarih}
                        </span>

                    </div>

                </article>

            `;

        }
    );

}



/* KATEGORİ BUTONLARI */

document
.querySelectorAll(
    ".nav button"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".nav button"
                )
                .forEach(
                    btn =>
                    btn.classList
                    .remove(
                        "active"
                    )
                );


                button.classList
                .add("active");


                aktifKategori =
                    button
                    .dataset
                    .category;


                filtrele();

            }
        );

    }
);



/* ARAMA */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    e => {

        arama =
            e.target.value;

        filtrele();

    }
);



/* BAŞLAT */

filtrele();

</script>

</body>
</html>
