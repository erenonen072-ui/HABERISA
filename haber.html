<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HABERİSTA</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

<div class="header-inner">

<a class="logo" href="index.html">
HABER<span>İSTA</span>
</a>

<a class="back-button" href="index.html">
← Ana Sayfa
</a>

</div>

</header>


<main class="article-container">

<div id="article"></div>

</main>


<footer>

<div class="footer-bottom">
© 2026 HABERİSTA. Tüm hakları saklıdır.
</div>

</footer>


<script src="HABERLER/haberler.js"></script>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    Number(params.get("id"));

const haber =
    haberler.find(h => h.id === id);


const article =
    document.getElementById("article");


if(!haber){

    article.innerHTML = `

        <div class="error-page">

            <h1>404</h1>

            <h2>Haber bulunamadı</h2>

            <p>
                Aradığınız haber mevcut değil.
            </p>

            <a href="index.html">
                Ana Sayfaya Dön
            </a>

        </div>

    `;

}else{

    document.title =
        haber.baslik + " | HABERİSTA";


    article.innerHTML = `

        <div class="article-category">
            ${haber.kategori}
        </div>

        <h1 class="article-title">
            ${haber.baslik}
        </h1>

        <div class="article-meta">

            <span>🕒 ${haber.tarih}</span>

            <span>
                ✍️ ${haber.yazar || "HABERİSTA"}
            </span>

        </div>

        <img
            class="article-cover"
            src="${haber.gorsel}"
            alt="${haber.baslik}">

        <div class="article-body">

            <p class="lead">
                ${haber.aciklama}
            </p>

            <div class="article-text">
                ${haber.icerik}
            </div>

        </div>

        <div class="share-area">

            <strong>Bu haberi paylaş</strong>

            <button onclick="shareNews()">
                ↗ Paylaş
            </button>

        </div>

    `;

}


async function shareNews(){

    try{

        await navigator.share({
            title:haber.baslik,
            text:haber.aciklama,
            url:window.location.href
        });

    }catch(e){

        await navigator.clipboard
            .writeText(window.location.href);

        alert("Haber bağlantısı kopyalandı.");

    }

}

</script>

</body>
</html>
