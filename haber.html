<script>
document.addEventListener("DOMContentLoaded", function () {

    "use strict";

    const news = Array.isArray(window.haberler)
        ? window.haberler
        : [];

    const title = document.getElementById("articleTitle");
    const category = document.getElementById("articleCategory");
    const breadcrumbCategory = document.getElementById("breadcrumbCategory");
    const spot = document.getElementById("articleSpot");
    const date = document.getElementById("articleDate");
    const views = document.getElementById("articleViews");
    const source = document.getElementById("articleSource");
    const image = document.getElementById("articleImage");
    const body = document.getElementById("articleBody");
    const related = document.getElementById("relatedNews");
    const notFound = document.getElementById("articleNotFound");
    const shell = document.querySelector(".article-shell");


    /* =====================================================
       URL'DEN SLUG AL
    ===================================================== */

    function getSlug() {

        const path = window.location.pathname;

        /*
            Örnek:

            /haber/5-eylul-2026-resmi-gazete-yayimlandi
        */

        const match = path.match(/^\/haber\/(.+?)(?:\/)?$/i);

        if (match && match[1]) {
            return decodeURIComponent(match[1]);
        }

        /* Eski sistem desteği */
        const params = new URLSearchParams(
            window.location.search
        );

        return params.get("slug") || params.get("id");
    }


    const slug = getSlug();


    /* =====================================================
       HABERİ BUL
    ===================================================== */

    let haber = null;

    if (slug) {

        /* Önce slug */
        haber = news.find(function (item) {
            return String(item.slug) === String(slug);
        });

        /* Sonra ID */
        if (!haber) {

            haber = news.find(function (item) {
                return String(item.id) === String(slug);
            });

        }

    }


    /* =====================================================
       HABER BULUNAMADI
    ===================================================== */

    if (!haber) {

        document.title =
            "Haber Bulunamadı | Haberİsta";

        if (shell) {
            shell.style.display = "none";
        }

        if (notFound) {
            notFound.style.display = "block";
        }

        return;
    }


    /* =====================================================
       HABER ALANLARI
       Haberler.js'deki gerçek isimlerle eşleşiyor
    ===================================================== */

    const haberBaslik =
        haber.baslik || "Haber";

    const haberKategori =
        haber.kategori || "Haber";

    const haberSpot =
        haber.spot || "";

    const haberTarih =
        haber.date || haber.tarih || "";

    const haberSaat =
        haber.time || haber.saat || "";

    const haberViews =
        haber.views ?? haber.okunma ?? 0;

    const haberSource =
        haber.source || haber.kaynak || "Haberİsta Haber Merkezi";

    const haberImage =
        haber.image || haber.resim || "images/default-news.jpg";

    const haberContent =
        haber.content || haber.icerik || "";


    /* =====================================================
       SAYFA BAŞLIĞI
    ===================================================== */

    document.title =
        haberBaslik + " | Haberİsta";


    /* =====================================================
       META DESCRIPTION
    ===================================================== */

    let description =
        document.querySelector(
            'meta[name="description"]'
        );

    if (!description) {

        description =
            document.createElement("meta");

        description.name = "description";

        document.head.appendChild(description);
    }

    description.content =
        haberSpot || haberBaslik;


    /* =====================================================
       BAŞLIK
    ===================================================== */

    if (title) {
        title.textContent = haberBaslik;
    }


    /* =====================================================
       KATEGORİ
    ===================================================== */

    if (category) {
        category.textContent = haberKategori;
    }

    if (breadcrumbCategory) {
        breadcrumbCategory.textContent =
            haberKategori;
    }


    /* =====================================================
       SPOT
    ===================================================== */

    if (spot) {
        spot.textContent = haberSpot;
    }


    /* =====================================================
       TARİH
    ===================================================== */

    if (date) {

        date.textContent =
            [haberTarih, haberSaat]
                .filter(Boolean)
                .join(" • ");
    }


    /* =====================================================
       OKUNMA
    ===================================================== */

    if (views) {

        views.textContent =
            Number(haberViews).toLocaleString("tr-TR") +
            " okunma";
    }


    /* =====================================================
       KAYNAK
    ===================================================== */

    if (source) {
        source.textContent = haberSource;
    }


    /* =====================================================
       GÖRSEL
    ===================================================== */

    if (image) {

        image.src = haberImage;
        image.alt = haberBaslik;

        image.onerror = function () {

            this.onerror = null;

            this.src =
                "images/default-news.jpg";
        };
    }


    /* =====================================================
       HABER İÇERİĞİ
    ===================================================== */

    if (body) {

        /*
            Senin Haberler.js'de content
            HTML olarak geliyor.

            Örneğin:

            <p>...</p>
            <h2>...</h2>
            <p>...</p>

            Bu yüzden escape edip düz yazıya
            çevirmiyoruz.
        */

        body.innerHTML =
            haberContent ||
            `<p>${haberSpot}</p>`;
    }


    /* =====================================================
       İLGİLİ HABERLER
    ===================================================== */

    if (related) {

        let relatedNews =
            news.filter(function (item) {

                return (
                    item.id !== haber.id &&
                    item.kategori === haber.kategori
                );

            });


        if (relatedNews.length < 4) {

            const otherNews =
                news.filter(function (item) {

                    return (
                        item.id !== haber.id &&
                        !relatedNews.some(function (r) {
                            return r.id === item.id;
                        })
                    );

                });


            relatedNews =
                relatedNews.concat(otherNews);
        }


        relatedNews =
            relatedNews.slice(0, 4);


        related.innerHTML =
            relatedNews.map(function (item) {

                const itemUrl =
                    item.url ||
                    "/haber/" +
                    item.slug;


                const itemImage =
                    item.image ||
                    item.resim ||
                    "images/default-news.jpg";


                return `
                    <a
                        class="related-card"
                        href="${itemUrl}"
                    >

                        <div class="related-image">

                            <img
                                src="${itemImage}"
                                alt="${item.baslik}"
                                loading="lazy"
                                onerror="
                                    this.onerror=null;
                                    this.src='images/default-news.jpg';
                                "
                            >

                        </div>

                        <div class="related-info">

                            <span>
                                ${item.kategori || "Haber"}
                            </span>

                            <h3>
                                ${item.baslik}
                            </h3>

                            <small>
                                ${item.date || ""}
                            </small>

                        </div>

                    </a>
                `;

            }).join("");
    }


    /* =====================================================
       PAYLAŞ
    ===================================================== */

    const share =
        document.getElementById("shareArticle");


    if (share) {

        share.addEventListener(
            "click",
            async function () {

                try {

                    if (navigator.share) {

                        await navigator.share({
                            title: haberBaslik,
                            text:
                                haberSpot ||
                                haberBaslik,
                            url:
                                window.location.href
                        });

                    } else {

                        await navigator.clipboard
                            .writeText(
                                window.location.href
                            );

                        alert(
                            "Haber bağlantısı kopyalandı."
                        );
                    }

                } catch (error) {

                    console.log(
                        "Paylaşım iptal edildi."
                    );
                }

            }
        );
    }


    /* =====================================================
       LİNK KOPYALA
    ===================================================== */

    const copy =
        document.getElementById(
            "copyArticleUrl"
        );


    if (copy) {

        copy.addEventListener(
            "click",
            async function () {

                try {

                    await navigator.clipboard
                        .writeText(
                            window.location.href
                        );

                    copy.textContent =
                        "✓ Kopyalandı";

                    setTimeout(function () {

                        copy.textContent =
                            "🔗 Linki Kopyala";

                    }, 1800);

                } catch (error) {

                    alert(
                        window.location.href
                    );
                }

            }
        );
    }


    /* =====================================================
       GERİ
    ===================================================== */

    function goBack() {

        if (
            document.referrer &&
            document.referrer.includes(
                window.location.host
            )
        ) {

            history.back();

        } else {

            window.location.href = "/";
        }
    }


    const back =
        document.getElementById(
            "articleBack"
        );

    const backBottom =
        document.getElementById(
            "articleBackBottom"
        );


    if (back) {
        back.addEventListener(
            "click",
            goBack
        );
    }


    if (backBottom) {
        backBottom.addEventListener(
            "click",
            goBack
        );
    }


    /* =====================================================
       ARAMA
    ===================================================== */

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchBtn =
        document.getElementById(
            "searchBtn"
        );


    function doSearch() {

        if (!searchInput) return;

        const q =
            searchInput.value.trim();

        if (!q) return;

        window.location.href =
            "/?q=" +
            encodeURIComponent(q);
    }


    if (searchBtn) {

        searchBtn.addEventListener(
            "click",
            doSearch
        );
    }


    if (searchInput) {

        searchInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {
                    doSearch();
                }

            }
        );
    }


    /* =====================================================
       MOBİL MENÜ
    ===================================================== */

    const menu =
        document.getElementById(
            "menuBtn"
        );

    const nav =
        document.querySelector(
            ".category-nav"
        );


    if (menu && nav) {

        menu.addEventListener(
            "click",
            function () {

                nav.classList.toggle(
                    "mobile-open"
                );

            }
        );
    }


    /* =====================================================
       ÇEREZ
    ===================================================== */

    const cookie =
        document.getElementById(
            "cookieBox"
        );

    const cookieAccept =
        document.getElementById(
            "cookieAccept"
        );


    if (cookie && cookieAccept) {

        if (
            localStorage.getItem(
                "haberista_cookie_accepted"
            ) === "1"
        ) {

            cookie.classList.add(
                "hidden"
            );
        }


        cookieAccept.addEventListener(
            "click",
            function () {

                localStorage.setItem(
                    "haberista_cookie_accepted",
                    "1"
                );

                cookie.classList.add(
                    "hidden"
                );

            }
        );
    }


    /* =====================================================
       OKUMA İLERLEMESİ
    ===================================================== */

    const progress =
        document.getElementById(
            "readingProgress"
        );


    function updateProgress() {

        if (!progress) return;

        const total =
            document.documentElement.scrollHeight -
            window.innerHeight;

        const current =
            window.scrollY;

        const percent =
            total > 0
                ? (current / total) * 100
                : 0;

        progress.style.width =
            Math.min(
                100,
                Math.max(
                    0,
                    percent
                )
            ) + "%";
    }


    window.addEventListener(
        "scroll",
        updateProgress,
        {
            passive: true
        }
    );


    updateProgress();

});
</script>
