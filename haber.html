<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Haber Detayı | Haberİsta</title>

    <meta
        name="description"
        content="Haberİsta güncel haberler ve son dakika gelişmeleri."
    >

    <meta
        name="robots"
        content="index, follow, max-image-preview:large"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <link
        rel="canonical"
        href="https://haberisa.vercel.app/haber.html"
    >

    <!-- Open Graph -->

    <meta
        property="og:type"
        content="article"
    >

    <meta
        property="og:site_name"
        content="Haberİsta"
    >

    <meta
        property="og:title"
        content="Haber Detayı | Haberİsta"
    >

    <meta
        property="og:description"
        content="Haberİsta güncel haberler ve son dakika gelişmeleri."
    >

    <meta
        property="og:url"
        content="https://haberisa.vercel.app/haber.html"
    >

    <meta
        property="og:image"
        content="https://haberisa.vercel.app/images/default-news.jpg"
    >

    <!-- Twitter -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Haber Detayı | Haberİsta"
    >

    <meta
        name="twitter:description"
        content="Haberİsta güncel haberler ve son dakika gelişmeleri."
    >

    <meta
        name="twitter:image"
        content="https://haberisa.vercel.app/images/default-news.jpg"
    >

    <link
        rel="icon"
        href="/favicon.ico"
    >

    <!-- Ana CSS -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            color: #18202a;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        /* =========================================
           ANA ALAN
        ========================================= */

        .haber-detail-page {
            width: min(
                1280px,
                calc(100% - 32px)
            );

            margin: 0 auto;

            padding:
                28px
                0
                70px;
        }

        /* =========================================
           BREADCRUMB
        ========================================= */

        .haber-breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 9px;

            margin-bottom: 22px;

            font-size: 14px;

            color: #6b7280;
        }

        .haber-breadcrumb a {
            color: #1769e0;
            font-weight: 700;
        }

        .haber-breadcrumb a:hover {
            text-decoration: underline;
        }

        .haber-breadcrumb span {
            color: #9ca3af;
        }

        /* =========================================
           ARTICLE CONTAINER
        ========================================= */

        #articleContainer {
            width: 100%;
        }

        /* =========================================
           LAYOUT
        ========================================= */

        .article-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                330px;

            gap: 28px;

            align-items: start;
        }

        /* =========================================
           ARTICLE
        ========================================= */

        .article-main {
            min-width: 0;

            background: #ffffff;

            border:
                1px solid
                #e5e7eb;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 8px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.06
                );
        }

        /* =========================================
           HEADER
        ========================================= */

        .article-header {
            padding:
                32px
                34px
                26px;
        }

        .article-category {
            display: inline-flex;

            align-items: center;

            padding:
                7px
                12px;

            margin-bottom: 16px;

            border-radius: 999px;

            background: #eaf2ff;

            color: #1769e0;

            font-size: 13px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .3px;
        }

        .article-title {
            margin: 0;

            color: #101828;

            font-size:
                clamp(
                    32px,
                    4vw,
                    52px
                );

            line-height: 1.08;

            letter-spacing: -1.5px;

            font-weight: 850;
        }

        .article-spot {
            margin:
                20px
                0
                0;

            color: #667085;

            font-size: 19px;

            line-height: 1.65;

            font-weight: 450;
        }

        /* =========================================
           META
        ========================================= */

        .article-meta {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 23px;

            color: #667085;

            font-size: 14px;
        }

        .article-meta span,
        .article-meta time {
            display: inline-flex;

            align-items: center;

            min-height: 30px;

            padding:
                5px
                10px;

            background: #f5f7fa;

            border-radius: 8px;
        }

        /* =========================================
           IMAGE
        ========================================= */

        .article-image-wrap {
            margin: 0;

            background: #eef1f5;
        }

        .article-image {
            display: block;

            width: 100%;

            max-height: 650px;

            object-fit: cover;
        }

        .article-image-wrap figcaption {
            padding:
                10px
                20px;

            color: #667085;

            background: #f8fafc;

            font-size: 12px;

            line-height: 1.5;
        }

        /* =========================================
           CONTENT
        ========================================= */

        .article-content {
            padding:
                32px
                34px
                36px;

            color: #263241;

            font-size: 18px;

            line-height: 1.9;
        }

        .article-content p {
            margin:
                0
                0
                22px;
        }

        .article-content h2 {
            margin:
                38px
                0
                17px;

            color: #101828;

            font-size: 27px;

            line-height: 1.25;

            font-weight: 800;

            letter-spacing: -.5px;
        }

        .article-content h3 {
            margin:
                30px
                0
                14px;

            color: #101828;

            font-size: 22px;

            line-height: 1.3;
        }

        .article-content strong {
            color: #111827;
            font-weight: 750;
        }

        .article-content ul,
        .article-content ol {
            margin:
                0
                0
                24px;

            padding-left: 25px;
        }

        .article-content li {
            margin-bottom: 9px;
        }

        .article-content blockquote {
            margin:
                30px
                0;

            padding:
                20px
                24px;

            border-left:
                4px solid
                #1769e0;

            background: #f4f8ff;

            border-radius:
                0
                12px
                12px
                0;

            color: #344054;

            font-style: italic;
        }

        /* =========================================
           SHARE
        ========================================= */

        .article-share {
            margin-top: 42px;

            padding-top: 25px;

            border-top:
                1px solid
                #e5e7eb;
        }

        .article-share > strong {
            display: block;

            margin-bottom: 13px;

            color: #111827;

            font-size: 16px;
        }

        .article-share-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .article-share-buttons a {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding:
                0
                16px;

            border-radius: 10px;

            color: #ffffff;

            font-size: 14px;

            font-weight: 750;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        .article-share-buttons a:hover {
            transform:
                translateY(-2px);

            opacity: .9;
        }

        .share-facebook {
            background: #1877f2;
        }

        .share-twitter {
            background: #111827;
        }

        .share-whatsapp {
            background: #20b958;
        }

        /* =========================================
           SOURCE
        ========================================= */

        .article-source-box {
            margin:
                0
                34px
                34px;

            padding:
                20px
                22px;

            border:
                1px solid
                #e2e8f0;

            background: #f8fafc;

            border-radius: 14px;
        }

        .article-source-box strong {
            display: block;

            margin-bottom: 7px;

            color: #111827;

            font-size: 15px;
        }

        .article-source-box p {
            margin: 0;

            color: #667085;

            font-size: 13px;

            line-height: 1.6;
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .article-sidebar {
            position: sticky;
            top: 20px;
        }

        .sidebar-box {
            background: #ffffff;

            border:
                1px solid
                #e5e7eb;

            border-radius: 18px;

            padding: 21px;

            box-shadow:
                0 8px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }

        .sidebar-box h2 {
            margin:
                0
                0
                18px;

            padding-bottom: 15px;

            border-bottom:
                1px solid
                #edf0f3;

            color: #101828;

            font-size: 20px;

            font-weight: 800;
        }

        .sidebar-news-list {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .sidebar-news-item {
            display: grid;

            grid-template-columns:
                90px
                minmax(0, 1fr);

            gap: 12px;

            align-items: center;

            padding-bottom: 14px;

            border-bottom:
                1px solid
                #edf0f3;
        }

        .sidebar-news-item:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .sidebar-news-item img {
            width: 90px;
            height: 68px;

            object-fit: cover;

            border-radius: 10px;

            background: #eef1f5;
        }

        .sidebar-news-item span {
            color: #1d2939;

            font-size: 14px;

            line-height: 1.45;

            font-weight: 700;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .sidebar-news-item:hover span {
            color: #1769e0;
        }

        /* =========================================
           ERROR
        ========================================= */

        .haber-error {
            width: 100%;

            padding:
                80px
                25px;

            text-align: center;

            background: #ffffff;

            border:
                1px solid
                #e5e7eb;

            border-radius: 20px;

            box-shadow:
                0 8px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }

        .haber-error h1 {
            margin:
                0
                0
                12px;

            color: #101828;

            font-size: 30px;
        }

        .haber-error p {
            margin: 0;

            color: #667085;

            line-height: 1.6;
        }

        .haber-error a {
            display: inline-flex;

            margin-top: 20px;

            padding:
                12px
                18px;

            background: #1769e0;

            color: #ffffff;

            border-radius: 10px;

            font-weight: 700;
        }

        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1050px) {

            .article-layout {
                grid-template-columns:
                    minmax(0, 1fr);
            }

            .article-sidebar {
                position: static;
            }

            .sidebar-news-list {
                display: grid;

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 14px;
            }

        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .haber-detail-page {
                width:
                    calc(100% - 20px);

                padding-top: 16px;

                padding-bottom: 40px;
            }

            .haber-breadcrumb {
                margin-bottom: 14px;

                font-size: 12px;
            }

            .article-main {
                border-radius: 15px;
            }

            .article-header {
                padding:
                    23px
                    19px
                    20px;
            }

            .article-category {
                margin-bottom: 13px;

                padding:
                    6px
                    10px;

                font-size: 11px;
            }

            .article-title {
                font-size: 31px;

                line-height: 1.12;

                letter-spacing: -.8px;
            }

            .article-spot {
                margin-top: 15px;

                font-size: 16px;

                line-height: 1.55;
            }

            .article-meta {
                gap: 7px;

                margin-top: 17px;

                font-size: 12px;
            }

            .article-meta span,
            .article-meta time {
                min-height: 27px;

                padding:
                    4px
                    8px;
            }

            .article-image {
                max-height: 390px;
            }

            .article-image-wrap figcaption {
                padding:
                    8px
                    14px;

                font-size: 11px;
            }

            .article-content {
                padding:
                    24px
                    19px
                    27px;

                font-size: 16.5px;

                line-height: 1.78;
            }

            .article-content p {
                margin-bottom: 19px;
            }

            .article-content h2 {
                margin-top: 30px;

                font-size: 22px;
            }

            .article-content h3 {
                font-size: 19px;
            }

            .article-share {
                margin-top: 30px;
            }

            .article-share-buttons {
                display: grid;

                grid-template-columns:
                    repeat(
                        3,
                        1fr
                    );

                gap: 7px;
            }

            .article-share-buttons a {
                min-height: 40px;

                padding:
                    0
                    6px;

                font-size: 12px;
            }

            .article-source-box {
                margin:
                    0
                    19px
                    22px;

                padding: 16px;
            }

            .sidebar-box {
                padding: 17px;

                border-radius: 15px;
            }

            .sidebar-news-list {
                grid-template-columns: 1fr;
            }

            .sidebar-news-item {
                grid-template-columns:
                    100px
                    minmax(0, 1fr);
            }

            .sidebar-news-item img {
                width: 100px;
                height: 72px;
            }

        }

        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 420px) {

            .article-title {
                font-size: 27px;
            }

            .article-spot {
                font-size: 15px;
            }

            .article-content {
                font-size: 16px;
            }

            .article-share-buttons a {
                font-size: 11px;
            }

        }

    </style>

</head>

<body>

    <!-- =========================================
         SITE HEADER
    ========================================= -->

    <header id="site-header"></header>

    <!-- =========================================
         ANA İÇERİK
    ========================================= -->

    <main class="haber-detail-page">

        <nav
            class="haber-breadcrumb"
            aria-label="Breadcrumb"
        >

            <a href="/">
                Ana Sayfa
            </a>

            <span>›</span>

            <span id="breadcrumb-category">
                Haber
            </span>

            <span>›</span>

            <span>
                Haber Detayı
            </span>

        </nav>

        <!-- =========================================
             BUILD.JS BURAYI DEĞİŞTİRİR
        ========================================= -->

        <div id="articleContainer">

            <article
                class="haber-article"
                id="haber-container"
            >

                <div class="haber-error">

                    <h1>
                        Haber yükleniyor...
                    </h1>

                    <p>
                        Haber içeriği hazırlanıyor.
                    </p>

                </div>

            </article>

        </div>

    </main>

    <!-- =========================================
         HABER VERİLERİ
    ========================================= -->

    <script src="/js/haberler.js"></script>

    <!-- =========================================
         DİNAMİK FALLBACK
    ========================================= -->

    <script>

        "use strict";

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /*
                 * ÇOK ÖNEMLİ
                 *
                 * build.js statik sayfalara:
                 *
                 * data-static-article="true"
                 *
                 * ekler.
                 *
                 * Statik sayfadaysak hiçbir şekilde
                 * aşağıdaki dinamik sistem çalışmaz.
                 */

                if (
                    document.body.dataset.staticArticle === "true"
                ) {
                    return;
                }

                const container =
                    document.getElementById(
                        "haber-container"
                    );

                const breadcrumbCategory =
                    document.getElementById(
                        "breadcrumb-category"
                    );

                if (!container) {
                    return;
                }

                const haberListesi =
                    Array.isArray(
                        window.haberler
                    )
                        ? window.haberler
                        : [];

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const id =
                    params.get("id");

                const slug =
                    params.get("slug");

                let haber = null;

                /* ID ile bul */

                if (id) {

                    haber =
                        haberListesi.find(
                            function (item) {

                                return (
                                    String(item.id) ===
                                    String(id)
                                );

                            }
                        );

                }

                /* Slug ile bul */

                if (!haber && slug) {

                    haber =
                        haberListesi.find(
                            function (item) {

                                return (
                                    String(
                                        item.slug || ""
                                    ) ===
                                    String(slug)
                                );

                            }
                        );

                }

                /* Haber bulunamadı */

                if (!haber) {

                    container.innerHTML = `

                        <div class="haber-error">

                            <h1>
                                Haber bulunamadı
                            </h1>

                            <p>
                                Aradığınız haber mevcut değil
                                veya bağlantı geçersiz olabilir.
                            </p>

                            <a href="/">
                                Ana Sayfaya Dön
                            </a>

                        </div>

                    `;

                    return;
                }

                function escapeHTML(value) {

                    return String(
                        value ?? ""
                    )
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }

                const title =
                    escapeHTML(
                        haber.baslik ||
                        "Haber"
                    );

                const category =
                    escapeHTML(
                        haber.kategori ||
                        "Gündem"
                    );

                const spot =
                    escapeHTML(
                        haber.spot ||
                        ""
                    );

                const date =
                    escapeHTML(
                        haber.tarih ||
                        ""
                    );

                const time =
                    escapeHTML(
                        haber.saat ||
                        ""
                    );

                const image =
                    haber.gorsel ||
                    "/images/default-news.jpg";

                const content =
                    haber.icerik ||
                    "";

                /* Breadcrumb */

                if (breadcrumbCategory) {

                    breadcrumbCategory.textContent =
                        haber.kategori ||
                        "Haber";

                }

                /* Başlık */

                document.title =
                    `${haber.baslik} | Haberİsta`;

                /* İçerik */

                function renderContent(text) {

                    const temiz =
                        String(text || "")
                            .replace(
                                /\r\n/g,
                                "\n"
                            )
                            .replace(
                                /\r/g,
                                "\n"
                            );

                    if (
                        /<(p|h2|h3|ul|ol|li|strong|em|blockquote|br)[\s>]/i
                            .test(temiz)
                    ) {

                        return temiz;

                    }

                    return temiz
                        .split("\n")
                        .filter(
                            function (line) {
                                return line.trim();
                            }
                        )
                        .map(
                            function (line) {

                                const value =
                                    line.trim();

                                if (
                                    value.length > 3 &&
                                    value.length < 120 &&
                                    value ===
                                        value.toLocaleUpperCase(
                                            "tr-TR"
                                        ) &&
                                    !/[.!?]$/.test(
                                        value
                                    )
                                ) {

                                    return `

                                        <h2>
                                            ${escapeHTML(value)}
                                        </h2>

                                    `;

                                }

                                return `

                                    <p>
                                        ${escapeHTML(value)}
                                    </p>

                                `;

                            }
                        )
                        .join("");

                }

                const currentURL =
                    window.location.href;

                const shareText =
                    encodeURIComponent(
                        haber.baslik ||
                        "Haberİsta"
                    );

                const shareURL =
                    encodeURIComponent(
                        currentURL
                    );

                /* Haber oluştur */

                container.innerHTML = `

                    <div class="article-layout">

                        <article
                            class="article-main"
                            itemscope
                            itemtype="https://schema.org/NewsArticle"
                        >

                            <header
                                class="article-header"
                            >

                                <div
                                    class="article-category"
                                >
                                    ${category}
                                </div>

                                <h1
                                    class="article-title"
                                    itemprop="headline"
                                >
                                    ${title}
                                </h1>

                                ${
                                    spot
                                        ? `

                                            <p
                                                class="article-spot"
                                                itemprop="description"
                                            >
                                                ${spot}
                                            </p>

                                        `
                                        : ""
                                }

                                <div
                                    class="article-meta"
                                >

                                    ${
                                        date
                                            ? `

                                                <time
                                                    itemprop="datePublished"
                                                >
                                                    ${date}
                                                </time>

                                            `
                                            : ""
                                    }

                                    ${
                                        time
                                            ? `

                                                <span>
                                                    ${time}
                                                </span>

                                            `
                                            : ""
                                    }

                                    <span>
                                        Haberİsta
                                    </span>

                                </div>

                            </header>

                            <figure
                                class="article-image-wrap"
                            >

                                <img
                                    class="article-image"
                                    src="${escapeHTML(image)}"
                                    alt="${title}"
                                    itemprop="image"
                                >

                                <figcaption>
                                    ${title}
                                </figcaption>

                            </figure>

                            <div
                                id="articleContent"
                                class="article-content"
                                itemprop="articleBody"
                            >

                                ${renderContent(content)}

                                <div
                                    class="article-share"
                                >

                                    <strong>
                                        Bu haberi paylaş
                                    </strong>

                                    <div
                                        class="article-share-buttons"
                                    >

                                        <a
                                            class="share-facebook"
                                            href="https://www.facebook.com/sharer/sharer.php?u=${shareURL}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            Facebook
                                        </a>

                                        <a
                                            class="share-twitter"
