<script src="js/haberler.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const haberler = window.haberler || [];

    console.log("Haberler:", haberler);

    /* ==========================================
       URL'DEN HABER BİLGİSİNİ AL
    ========================================== */

    const path = window.location.pathname;
    const params = new URLSearchParams(window.location.search);

    let slug = params.get("slug");
    let id = params.get("id");

    /* /haber/xxxxx */
    const match = path.match(/\/haber\/(.+)$/);

    if (match) {
        slug = decodeURIComponent(match[1]);
    }

    console.log("Bulunacak slug:", slug);
    console.log("Bulunacak id:", id);


    /* ==========================================
       HABERİ BUL
    ========================================== */

    let haber = null;


    /* ID ile */
    if (id) {

        haber = haberler.find(function (item) {
            return String(item.id) === String(id);
        });

    }


    /* Slug ile */
    if (!haber && slug) {

        haber = haberler.find(function (item) {
            return String(item.slug) === String(slug);
        });

    }


    /* Slug yoksa başlıktan üret */
    if (!haber && slug && window.slugOlustur) {

        haber = haberler.find(function (item) {

            return window.slugOlustur(
                item.baslik
            ) === slug;

        });

    }


    /* ==========================================
       BULUNAMADI
    ========================================== */

    const notFound =
        document.getElementById("articleNotFound");

    const shell =
        document.querySelector(".article-shell");


    if (!haber) {

        console.error(
            "HABER BULUNAMADI",
            slug,
            haberler
        );

        if (shell) {
            shell.style.display = "none";
        }

        if (notFound) {
            notFound.style.display = "block";
        }

        return;
    }


    console.log("HABER BULUNDU:", haber);


    /* ==========================================
       VERİLER
    ========================================== */

    const baslik =
        haber.baslik || "Haber";

    const kategori =
        haber.kategori || "Haber";

    const spot =
        haber.spot || "";

    const tarih =
        haber.date || haber.tarih || "";

    const saat =
        haber.time || haber.saat || "";

    const okunma =
        haber.views ??
        haber.okunma ??
        0;

    const kaynak =
        haber.source ||
        haber.kaynak ||
        "Haberİsta Haber Merkezi";

    const resim =
        haber.image ||
        haber.resim ||
        "images/default-news.jpg";

    const icerik =
        haber.content ||
        haber.icerik ||
        spot;


    /* ==========================================
       HTML ELEMANLARI
    ========================================== */

    const title =
        document.getElementById("articleTitle");

    const category =
        document.getElementById("articleCategory");

    const breadcrumb =
        document.getElementById(
            "breadcrumbCategory"
        );

    const spotElement =
        document.getElementById("articleSpot");

    const dateElement =
        document.getElementById("articleDate");

    const viewsElement =
        document.getElementById("articleViews");

    const sourceElement =
        document.getElementById("articleSource");

    const image =
        document.getElementById("articleImage");

    const body =
        document.getElementById("articleBody");


    /* ==========================================
       SAYFA
    ========================================== */

    document.title =
        baslik + " | Haberİsta";


    if (title)
        title.textContent = baslik;


    if (category)
        category.textContent = kategori;


    if (breadcrumb)
        breadcrumb.textContent = kategori;


    if (spotElement)
        spotElement.textContent = spot;


    if (dateElement) {

        dateElement.textContent =
            [tarih, saat]
                .filter(Boolean)
                .join(" • ");

    }


    if (viewsElement) {

        viewsElement.textContent =
            Number(okunma)
                .toLocaleString("tr-TR") +
            " okunma";

    }


    if (sourceElement)
        sourceElement.textContent = kaynak;


    /* ==========================================
       GÖRSEL
    ========================================== */

    if (image) {

        image.src = resim;
        image.alt = baslik;

        image.onerror = function () {

            this.onerror = null;

            this.src =
                "images/default-news.jpg";

        };

    }


    /* ==========================================
       İÇERİK
    ========================================== */

    if (body) {

        /*
         * Haberler.js'deki content zaten HTML.
         * Bu yüzden escape etmiyoruz.
         */

        body.innerHTML = icerik;

    }


    /* ==========================================
       İLGİLİ HABERLER
    ========================================== */

    const related =
        document.getElementById(
            "relatedNews"
        );


    if (related) {

        const ilgili =
            haberler
                .filter(function (item) {

                    return (
                        item.id !== haber.id &&
                        item.kategori === kategori
                    );

                })
                .concat(
                    haberler.filter(function (item) {

                        return item.id !== haber.id;

                    })
                )
                .filter(function (item, index, array) {

                    return array.findIndex(
                        function (x) {
                            return x.id === item.id;
                        }
                    ) === index;

                })
                .slice(0, 4);


        related.innerHTML =
            ilgili.map(function (item) {

                const url =
                    item.url ||
                    "/haber/" +
                    item.slug;


                const img =
                    item.image ||
                    item.resim ||
                    "images/default-news.jpg";


                return `
                    <a
                        class="related-card"
                        href="${url}"
                    >

                        <div class="related-image">

                            <img
                                src="${img}"
                                alt="${item.baslik}"
                                loading="lazy"
                            >

                        </div>

                        <div class="related-info">

                            <span>
                                ${item.kategori || "Haber"}
                            </span>

                            <h3>
                                ${item.baslik}
                            </h3>

                            <small>
                                ${item.date || ""}
                            </small>

                        </div>

                    </a>
                `;

            }).join("");

    }


});
</script>
