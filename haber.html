<!DOCTYPE html>
<html lang="tr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Haberİsta haber detay sayfası"
    >

    <meta
        name="theme-color"
        content="#e11d48"
    >

    <title>Haberİsta</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/haber.css">

    <style>

        /* =====================================================
           TEMEL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: #f5f5f5;

            color: #0a0a0a;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            transition:
                background .25s,
                color .25s;
        }


        /* =====================================================
           SAYFA
        ===================================================== */

        .article-page {
            min-height: 100vh;

            padding:
                24px 16px 70px;
        }

        .article-wrapper {
            width:
                min(1200px, 100%);

            margin: 0 auto;
        }


        /* =====================================================
           ÜST BAR
        ===================================================== */

        .article-top {

            height: 62px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;
        }

        .article-logo {

            text-decoration: none;

            font-size: 31px;

            font-weight: 950;

            letter-spacing: -1.8px;

            color: #080808;
        }

        .article-logo span {
            color: #e11d48;
        }


        .back-button {

            display: flex;

            align-items: center;

            gap: 7px;

            border:
                1px solid #dedede;

            background: #ffffff;

            color: #111111;

            padding:
                10px 16px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .back-button:hover {

            background: #111111;

            color: #ffffff;

            border-color:
                #111111;
        }


        /* =====================================================
           HABER KARTI
        ===================================================== */

        .article-card {

            background: #ffffff;

            border:
                1px solid #dedede;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.06);
        }


        /* =====================================================
           HABER HEADER
        ===================================================== */

        .article-header {

            padding:
                38px 50px 32px;
        }


        /* =====================================================
           KATEGORİ
        ===================================================== */

        .article-category {

            margin-bottom: 18px;
        }

        .article-category span {

            display: inline-flex;

            align-items: center;

            padding:
                7px 12px;

            background:
                #e11d48;

            color: #ffffff;

            border-radius: 4px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: .7px;

            text-transform:
                uppercase;
        }


        /* =====================================================
           BAŞLIK
        ===================================================== */

        .article-title h1 {

            max-width:
                1080px;

            margin: 0;

            color:
                #050505;

            font-size:
                clamp(
                    34px,
                    5vw,
                    58px
                );

            line-height:
                1.04;

            letter-spacing:
                -2.3px;

            font-weight:
                950;

            text-wrap:
                balance;
        }


        /* =====================================================
           SPOT
        ===================================================== */

        .article-spot {

            max-width:
                950px;

            margin-top:
                22px;
        }

        .article-spot p {

            margin: 0;

            color:
                #222222;

            font-size:
                20px;

            line-height:
                1.55;

            font-weight:
                600;

            letter-spacing:
                -.2px;
        }


        /* =====================================================
           META
        ===================================================== */

        .article-meta {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap:
                9px 14px;

            margin-top:
                24px;

            color:
                #555555;

            font-size:
                13px;

            font-weight:
                500;
        }

        .article-meta strong {

            color:
                #171717;

            font-weight:
                800;
        }

        .meta-separator {

            width: 4px;

            height: 4px;

            background:
                #aaaaaa;

            border-radius:
                50%;
        }

        .article-source-mini {

            color:
                #333333;

            font-weight:
                800;
        }


        /* =====================================================
           FOTOĞRAF
        ===================================================== */

        .article-image-wrapper {

            width: 100%;

            background:
                #e9e9e9;

            overflow:
                hidden;
        }

        .article-image {

            display: block;

            width: 100%;

            max-height:
                680px;

            min-height:
                300px;

            object-fit:
                cover;

            object-position:
                center;
        }

        .image-caption {

            padding:
                9px 50px;

            background:
                #fafafa;

            border-bottom:
                1px solid #e4e4e4;

            color:
                #888888;

            font-size:
                11px;

            font-weight:
                500;
        }


        /* =====================================================
           ERİŞİLEBİLİRLİK PANELİ
        ===================================================== */

        .accessibility-panel {

            margin:
                0 50px 28px;

            padding:
                18px;

            background:
                #f7f7f7;

            border:
                1px solid #dddddd;

            border-radius:
                10px;
        }

        .accessibility-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom:
                14px;
        }

        .accessibility-title {

            color:
                #080808;

            font-size:
                14px;

            font-weight:
                950;
        }

        .accessibility-description {

            color:
                #666666;

            font-size:
                11px;

            font-weight:
                600;
        }


        /* =====================================================
           SES BUTONLARI
        ===================================================== */

        .voice-controls {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 8px;
        }

        .voice-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            min-height:
                42px;

            padding:
                10px 15px;

            border:
                1px solid #cccccc;

            border-radius:
                7px;

            background:
                #ffffff;

            color:
                #111111;

            font-size:
                13px;

            font-weight:
                850;

            cursor:
                pointer;

            transition:
                .2s;
        }

        .voice-button:hover {

            background:
                #111111;

            color:
                #ffffff;

            border-color:
                #111111;
        }

        .voice-button.primary {

            background:
                #111111;

            color:
                #ffffff;

            border-color:
                #111111;
        }

        .voice-button.primary:hover {

            background:
                #e11d48;

            border-color:
                #e11d48;
        }

        .voice-button.active {

            background:
                #e11d48;

            color:
                #ffffff;

            border-color:
                #e11d48;
        }


        /* =====================================================
           HIZ SEÇENEKLERİ
        ===================================================== */

        .speed-controls {

            display: flex;

            align-items: center;

            gap: 5px;

            margin-left:
                5px;

            padding-left:
                12px;

            border-left:
                1px solid #d7d7d7;
        }

        .speed-label {

            color:
                #555555;

            font-size:
                11px;

            font-weight:
                800;

            margin-right:
                3px;
        }

        .speed-button {

            width:
                38px;

            height:
                34px;

            border:
                1px solid #d4d4d4;

            border-radius:
                6px;

            background:
                #ffffff;

            color:
                #333333;

            font-size:
                11px;

            font-weight:
                850;

            cursor:
                pointer;
        }

        .speed-button:hover {

            background:
                #111111;

            color:
                #ffffff;
        }

        .speed-button.selected {

            background:
                #111111;

            color:
                #ffffff;

            border-color:
                #111111;
        }


        /* =====================================================
           SES DURUMU
        ===================================================== */

        .voice-status {

            margin-top:
                11px;

            color:
                #555555;

            font-size:
                11px;

            font-weight:
                600;
        }


        /* =====================================================
           OKUMA ANİMASYONU
        ===================================================== */

        .reading-indicator {

            display:
                none;

            align-items:
                center;

            gap:
                6px;

            margin-top:
                12px;

            color:
                #e11d48;

            font-size:
                11px;

            font-weight:
                850;
        }

        .reading-indicator.show {
            display: flex;
        }

        .reading-dot {

            width:
                7px;

            height:
                7px;

            background:
                #e11d48;

            border-radius:
                50%;

            animation:
                voicePulse 1s infinite;
        }

        @keyframes voicePulse {

            0% {
                transform: scale(.8);
                opacity: .5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(.8);
                opacity: .5;
            }

        }


        /* =====================================================
           İÇERİK
        ===================================================== */

        .article-body-layout {

            display: grid;

            grid-template-columns:
                minmax(0, 850px)
                240px;

            gap:
                50px;

            justify-content:
                center;

            padding:
                44px 50px 50px;
        }

        .article-content {
            min-width: 0;
        }


        /* =====================================================
           PARAGRAFLAR
        ===================================================== */

        .article-content p {

            margin:
                0 0 26px;

            color:
                #111111;

            font-size:
                18px;

            line-height:
                1.92;

            font-weight:
                500;

            letter-spacing:
                -.05px;
        }

        .article-content p:first-child {

            color:
                #080808;

            font-size:
                20px;

            line-height:
                1.8;

            font-weight:
                650;
        }


        /* =====================================================
           H2
        ===================================================== */

        .article-content h2 {

            margin:
                45px 0 20px;

            padding-left:
                15px;

            border-left:
                5px solid #e11d48;

            color:
                #050505;

            font-size:
                29px;

            line-height:
                1.25;

            font-weight:
                950;

            letter-spacing:
                -.8px;
        }


        /* =====================================================
           H3
        ===================================================== */

        .article-content h3 {

            margin:
                35px 0 16px;

            color:
                #080808;

            font-size:
                23px;

            line-height:
                1.3;

            font-weight:
                900;

            letter-spacing:
                -.4px;
        }


        /* =====================================================
           STRONG
        ===================================================== */

        .article-content strong {

            color:
                #000000;

            font-weight:
                900;
        }


        /* =====================================================
           LİSTELER
        ===================================================== */

        .article-content ul,
        .article-content ol {

            margin:
                24px 0 30px;

            padding-left:
                30px;
        }

        .article-content li {

            margin-bottom:
                13px;

            color:
                #111111;

            font-size:
                17px;

            line-height:
                1.75;

            font-weight:
                500;
        }


        /* =====================================================
           BLOCKQUOTE
        ===================================================== */

        .article-content blockquote {

            margin:
                35px 0;

            padding:
                22px 25px;

            background:
                #f6f6f6;

            border-left:
                5px solid #e11d48;

            border-radius:
                0 8px 8px 0;

            color:
                #191919;

            font-size:
                18px;

            line-height:
                1.75;

            font-weight:
                600;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .article-sidebar {

            position:
                sticky;

            top:
                20px;

            align-self:
                start;
        }

        .sidebar-box {

            background:
                #fafafa;

            border:
                1px solid #dedede;

            border-radius:
                9px;

            overflow:
                hidden;
        }

        .sidebar-title {

            padding:
                14px 16px;

            border-bottom:
                1px solid #dedede;

            color:
                #0a0a0a;

            font-size:
                13px;

            font-weight:
                900;
        }

        .sidebar-content {

            padding:
                16px;
        }

        .sidebar-content p {

            margin: 0;

            color:
                #444444;

            font-size:
                13px;

            line-height:
                1.7;
        }


        /* =====================================================
           KAYNAK
        ===================================================== */

        .article-source {

            margin:
                0 50px 30px;

            padding:
                16px 18px;

            background:
                #f7f7f7;

            border:
                1px solid #dddddd;

            border-radius:
                8px;

            color:
                #444444;

            font-size:
                13px;
        }

        .article-source strong {

            color:
                #000000;

            font-weight:
                900;
        }


        /* =====================================================
           PAYLAŞ
        ===================================================== */

        .article-share {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                0 50px 40px;
        }

        .share-title {

            margin-right:
                5px;

            color:
                #333333;

            font-size:
                13px;

            font-weight:
                900;
        }

        .share-btn {

            width:
                40px;

            height:
                40px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid #dddddd;

            border-radius:
                50%;

            background:
                #ffffff;

            color:
                #111111;

            cursor:
                pointer;

            transition:
                .2s;
        }

        .share-btn:hover {

            background:
                #111111;

            color:
                #ffffff;

            border-color:
                #111111;

            transform:
                translateY(-2px);
        }


        /* =====================================================
           AYRAÇ
        ===================================================== */

        .article-end {

            height:
                1px;

            margin:
                0 50px;

            background:
                #dedede;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .article-footer {

            padding:
                28px 10px 0;

            text-align:
                center;

            color:
                #888888;

            font-size:
                12px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .article-loading {

            min-height:
                65vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #555555;

            font-size:
                16px;

            font-weight:
                600;
        }


        /* =====================================================
           HATA
        ===================================================== */

        .article-error {

            padding:
                80px 25px;

            background:
                #ffffff;

            text-align:
                center;

            border:
                1px solid #dddddd;

            border-radius:
                12px;
        }

        .article-error-icon {

            width:
                60px;

            height:
                60px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                0 auto 18px;

            background:
                #fff1f2;

            color:
                #e11d48;

            border-radius:
                50%;

            font-size:
                25px;

            font-weight:
                900;
        }

        .article-error h1 {

            margin:
                0 0 10px;

            color:
                #050505;

            font-size:
                32px;

            font-weight:
                950;
        }

        .article-error p {

            max-width:
                500px;

            margin:
                0 auto 25px;

            color:
                #555555;

            line-height:
                1.6;
        }

        .article-error button {

            border:
                0;

            background:
                #e11d48;

            color:
                #ffffff;

            padding:
                12px 22px;

            border-radius:
                7px;

            font-weight:
                800;

            cursor:
                pointer;
        }


        /* =====================================================
           YÜKSEK KONTRAST
        ===================================================== */

        body.high-contrast {

            background:
                #000000;
        }

        body.high-contrast .article-card {

            background:
                #000000;

            border-color:
                #ffffff;
        }

        body.high-contrast .article-header,
        body.high-contrast .article-body-layout {

            background:
                #000000;
        }

        body.high-contrast .article-title h1,
        body.high-contrast .article-content h2,
        body.high-contrast .article-content h3 {

            color:
                #ffffff !important;
        }

        body.high-contrast .article-spot p,
        body.high-contrast .article-content p,
        body.high-contrast .article-content li {

            color:
                #ffffff !important;
        }

        body.high-contrast .article-content blockquote {

            background:
                #111111;

            color:
                #ffffff;
        }

        body.high-contrast .accessibility-panel {

            background:
                #111111;

            border-color:
                #ffffff;
        }

        body.high-contrast .accessibility-title,
        body.high-contrast .accessibility-description,
        body.high-contrast .voice-status {

            color:
                #ffffff;
        }


        /* =====================================================
           YAZI BÜYÜTME
        ===================================================== */

        body.large-text .article-content p {
            font-size:
                21px;
        }

        body.large-text .article-content p:first-child {
            font-size:
                23px;
        }

        body.large-text .article-content li {
            font-size:
                20px;
        }

        body.large-text .article-content h2 {
            font-size:
                32px;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .article-body-layout {

                grid-template-columns:
                    1fr;

                gap:
                    25px;
            }

            .article-sidebar {

                position:
                    static;
            }

        }


        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 700px) {

            .article-page {

                padding:
                    8px 7px 40px;
            }

            .article-top {

                height:
                    55px;
            }

            .article-logo {

                font-size:
                    23px;
            }

            .back-button {

                padding:
                    8px 11px;

                font-size:
                    12px;
            }

            .article-card {

                border-radius:
                    10px;
            }

            .article-header {

                padding:
                    25px 18px 23px;
            }

            .article-category {

                margin-bottom:
                    14px;
            }

            .article-title h1 {

                font-size:
                    32px;

                line-height:
                    1.08;

                letter-spacing:
                    -1.2px;
            }

            .article-spot {

                margin-top:
                    16px;
            }

            .article-spot p {

                font-size:
                    17px;

                line-height:
                    1.55;
            }

            .article-meta {

                margin-top:
                    18px;

                font-size:
                    11px;
            }

            .article-image {

                min-height:
                    220px;

                max-height:
                    450px;
            }

            .image-caption {

                padding:
                    8px 18px;
            }


            /* SES PANELİ */

            .accessibility-panel {

                margin:
                    0 18px 25px;

                padding:
                    15px;
            }

            .accessibility-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;

                gap:
                    5px;
            }

            .voice-controls {

                display:
                    grid;

                grid-template-columns:
                    1fr 1fr;

                width:
                    100%;
            }

            .voice-button {

                width:
                    100%;
            }

            .speed-controls {

                grid-column:
                    1 / -1;

                margin:
                    5px 0 0;

                padding:
                    10px 0 0;

                border-left:
                    0;

                border-top:
                    1px solid #d7d7d7;

                justify-content:
                    center;
            }


            /* İÇERİK */

            .article-body-layout {

                padding:
                    28px 18px 35px;
            }

            .article-content p {

                font-size:
                    17px;

                line-height:
                    1.85;

                margin-bottom:
                    22px;
            }

            .article-content p:first-child {

                font-size:
                    18px;

                line-height:
                    1.8;
            }

            .article-content h2 {

                margin-top:
                    36px;

                font-size:
                    24px;

                padding-left:
                    12px;
            }

            .article-content h3 {

                font-size:
                    20px;
            }

            .article-content li {

                font-size:
                    16px;
            }

            .article-content blockquote {

                padding:
                    17px 18px;

                font-size:
                    16px;
            }

            .article-source {

                margin:
                    0 18px 25px;

                font-size:
                    12px;
            }

            .article-share {

                padding:
                    0 18px 28px;
            }

            .article-end {

                margin:
                    0 18px;
            }

        }

    </style>

</head>

<body>


<main class="article-page">

    <div class="article-wrapper">


        <!-- =================================================
             ÜST
        ================================================== -->

        <div class="article-top">

            <a
                href="/"
                class="article-logo"
                aria-label="Haberİsta ana sayfa"
            >
                <span>Haber</span>İsta
            </a>


            <button
                type="button"
                class="back-button"
                onclick="goBack()"
                aria-label="Geri dön"
            >
                ← Geri
            </button>

        </div>


        <!-- =================================================
             HABER
        ================================================== -->

        <article id="articleContainer">

            <div class="article-loading">

                Haber yükleniyor...

            </div>

        </article>


        <div class="article-footer">

            © 2026 Haberİsta ·
            Tüm hakları saklıdır.

        </div>


    </div>

</main>



<script src="/js/haberler.js"></script>


<script>

(function () {

    "use strict";


    const container =
        document.getElementById(
            "articleContainer"
        );


    const news =
        Array.isArray(
            window.haberler
        )
            ? window.haberler
            : [];


    /* =====================================================
       HABERLER YÜKLENMEDİ
    ===================================================== */

    if (!news.length) {

        showError(
            "Haber verileri yüklenemedi."
        );

        return;

    }


    /* =====================================================
       URL
    ===================================================== */

    const pathname =
        window.location.pathname;

    const params =
        new URLSearchParams(
            window.location.search
        );


    let slug = "";

    let id = "";


    const pathMatch =
        pathname.match(
            /^\/haber\/([^\/]+)\/?$/i
        );


    if (pathMatch) {

        slug =
            decodeURIComponent(
                pathMatch[1]
            );

    }


    if (
        !slug &&
        params.get("slug")
    ) {

        slug =
            params.get("slug");

    }


    if (
        !slug &&
        params.get("haber")
    ) {

        const value =
            params.get("haber");


        if (
            /^\d+$/.test(value)
        ) {

            id = value;

        } else {

            slug = value;

        }

    }


    if (
        !slug &&
        !id &&
        params.get("haberId")
    ) {

        id =
            params.get("haberId");

    }


    if (
        !slug &&
        !id &&
        params.get("id")
    ) {

        id =
            params.get("id");

    }


    /* =====================================================
       HABER BUL
    ===================================================== */

    let haber = null;


    if (id) {

        haber =
            news.find(
                function (item) {

                    return (
                        String(item.id)
                        ===
                        String(id)
                    );

                }
            );

    }


    if (
        !haber &&
        slug
    ) {

        const temizSlug =
            slugify(slug);


        haber =
            news.find(
                function (item) {

                    return (
                        slugify(
                            item.slug ||
                            item.baslik
                        )
                        ===
                        temizSlug
                    );

                }
            );

    }


    if (!haber) {

        showError();

        return;

    }


    /* =====================================================
       HABERİ GÖSTER
    ===================================================== */

    renderArticle(haber);


    function renderArticle(haber) {


        const baslik =
            haber.baslik ||
            haber.title ||
            "Haber";


        const kategori =
            haber.kategori ||
            haber.category ||
            "Haber";


        const tarih =
            haber.tarih ||
            haber.date ||
            "";


        const saat =
            haber.saat ||
            haber.time ||
            "";


        const okunma =
            haber.okunma ??
            haber.views ??
            "";


        const kaynak =
            haber.kaynak ||
            haber.source ||
            "Haberİsta";


        const spot =
            haber.spot ||
            haber.description ||
            "";


        const resim =
            haber.image ||
            haber.resim ||
            haber.gorsel ||
            haber["görsel"] ||
            haber.foto ||
            haber.fotograf ||
            haber.photo ||
            haber.thumbnail ||
            haber.img ||
            "";


        const icerik =
            haber.icerik ||
            haber.content ||
            "";


        document.title =
            baslik +
            " | Haberİsta";


        const imagePath =
            getImagePath(resim);


        /* =================================================
           HTML
        ================================================= */

        container.innerHTML = `

            <div class="article-card">


                <header class="article-header">


                    <div class="article-category">

                        <span>
                            ${escapeHtml(kategori)}
                        </span>

                    </div>


                    <div class="article-title">

                        <h1>
                            ${escapeHtml(baslik)}
                        </h1>

                    </div>


                    ${
                        spot
                        ? `
                            <div class="article-spot">

                                <p>
                                    ${escapeHtml(spot)}
                                </p>

                            </div>
                        `
                        : ""
                    }


                    <div class="article-meta">


                        ${
                            tarih
                            ? `
                                <span>
                                    <strong>
                                        ${escapeHtml(tarih)}
                                    </strong>
                                </span>
                            `
                            : ""
                        }


                        ${
                            saat
                            ? `
                                <span class="meta-separator">
                                </span>

                                <span>
                                    ${escapeHtml(saat)}
                                </span>
                            `
                            : ""
                        }


                        ${
                            okunma !== ""
                            ? `
                                <span class="meta-separator">
                                </span>

                                <span>
                                    👁
                                    ${escapeHtml(
                                        String(okunma)
                                    )}
                                    okunma
                                </span>
                            `
                            : ""
                        }


                        <span class="meta-separator">
                        </span>


                        <span class="article-source-mini">

                            ${escapeHtml(kaynak)}

                        </span>


                    </div>


                </header>


                ${
                    imagePath
                    ? `
                        <div class="article-image-wrapper">

                            <img
                                class="article-image"
                                src="${escapeAttribute(imagePath)}"
                                alt="${escapeAttribute(baslik)}"
                                loading="eager"
                                onerror="this.style.display='none'"
                            >

                        </div>

                        <div class="image-caption">

                            Haberİsta · Haber görseli

                        </div>
                    `
                    : ""
                }



                <!-- =========================================
                     ERİŞİLEBİLİRLİK
                ========================================== -->

                <section
                    class="accessibility-panel"
                    aria-label="Erişilebilirlik ve sesli okuma"
                >


                    <div class="accessibility-header">

                        <div>

                            <div class="accessibility-title">

                                🔊 Haber Sesli Okuma

                            </div>


                            <div class="accessibility-description">

                                Haberi dinlemek için
                                aşağıdaki kontrolleri kullanabilirsiniz.

                            </div>

                        </div>

                    </div>



                    <div class="voice-controls">


                        <button
                            type="button"
                            id="voiceStart"
                            class="voice-button primary"
                            onclick="startVoiceReader()"
                        >
                            🔊 Haberi Oku
                        </button>


                        <button
                            type="button"
                            id="voicePause"
                            class="voice-button"
                            onclick="pauseVoiceReader()"
                        >
                            ⏸ Duraklat
                        </button>


                        <button
                            type="button"
                            id="voiceResume"
                            class="voice-button"
                            onclick="resumeVoiceReader()"
                        >
                            ▶ Devam Et
                        </button>


                        <button
                            type="button"
                            id="voiceStop"
                            class="voice-button"
                            onclick="stopVoiceReader()"
                        >
                            ⏹ Durdur
                        </button>



                        <div class="speed-controls">

                            <span class="speed-label">
                                Okuma hızı:
                            </span>


                            <button
                                type="button"
                                class="speed-button"
                                data-speed="0.75"
                                onclick="setVoiceSpeed(0.75)"
                            >
                                0.75x
                            </button>


                            <button
                                type="button"
                                class="speed-button selected"
                                data-speed="1"
                                onclick="setVoiceSpeed(1)"
                            >
                                1x
                            </button>


                            <button
                                type="button"
                                class="speed-button"
                                data-speed="1.25"
                                onclick="setVoiceSpeed(1.25)"
                            >
                                1.25x
                            </button>


                            <button
                                type="button"
                                class="speed-button"
                                data-speed="1.5"
                                onclick="setVoiceSpeed(1.5)"
                            >
                                1.5x
                            </button>

                        </div>


                    </div>



                    <div
                        id="voiceStatus"
                        class="voice-status"
                        aria-live="polite"
                    >
                        Sesli okuma hazır.
                    </div>


                    <div
                        id="readingIndicator"
                        class="reading-indicator"
                    >

                        <span class="reading-dot"></span>

                        Haber sesli olarak okunuyor...

                    </div>


                </section>



                <!-- =========================================
                     İÇERİK
                ========================================== -->

                <div class="article-body-layout">


                    <div
                        class="article-content"
                        id="articleContent"
                    ></div>



                    <aside
                        class="article-sidebar"
                        aria-label="Haberİsta"
                    >

                        <div class="sidebar-box">


                            <div class="sidebar-title">

                                HABERİSTA

                            </div>


                            <div class="sidebar-content">

                                <p>

                                    Türkiye ve dünyadan
                                    güncel gelişmeleri
                                    Haberİsta farkıyla
                                    takip edin.

                                </p>

                            </div>


                        </div>

                    </aside>


                </div>



                <!-- =========================================
                     KAYNAK
                ========================================== -->

                ${
                    kaynak
                    ? `
                        <div class="article-source">

                            <strong>
                                Kaynak:
                            </strong>

                            ${escapeHtml(kaynak)}

                        </div>
                    `
                    : ""
                }



                <!-- =========================================
                     YAZI ERİŞİLEBİLİRLİĞİ
                ========================================== -->

                <div
                    class="accessibility-panel"
                    style="margin-top:0;"
                >

                    <div class="accessibility-header">

                        <div class="accessibility-title">

                            ♿ Okuma Kolaylığı

                        </div>

                    </div>


                    <div class="voice-controls">


                        <button
                            type="button"
                            class="voice-button"
                            onclick="increaseTextSize()"
                        >
                            🔎 Yazıyı Büyüt
                        </button>


                        <button
                            type="button"
                            class="voice-button"
                            onclick="resetTextSize()"
                        >
                            A Normal
                        </button>


                        <button
                            type="button"
                            class="voice-button"
                            onclick="toggleHighContrast()"
                        >
                            ◐ Yüksek Kontrast
                        </button>


                    </div>

                </div>



                <!-- =========================================
                     PAYLAŞ
                ========================================== -->

                <div class="article-share">


                    <span class="share-title">

                        Haberi paylaş:

                    </span>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="shareNews()"
                        title="Haberi paylaş"
                        aria-label="Haberi paylaş"
                    >
                        ↗
                    </button>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="copyLink()"
                        title="Bağlantıyı kopyala"
                        aria-label="Bağlantıyı kopyala"
                    >
                        🔗
                    </button>


                </div>


                <div class="article-end"></div>


            </div>

        `;


        /* =================================================
           İÇERİK
        ================================================= */

        const contentBox =
            document.getElementById(
                "articleContent"
            );


        if (!icerik) {

            contentBox.innerHTML = `

                <p>

                    Bu haber için henüz
                    detaylı içerik eklenmemiştir.

                </p>

            `;

            return;

        }


        if (
            /<[a-z][\s\S]*>/i.test(
                String(icerik)
            )
        ) {

            contentBox.innerHTML =
                icerik;

        } else {

            contentBox.innerHTML =
                String(icerik)
                    .split(/\n+/)
                    .map(
                        text =>
                            text.trim()
                    )
                    .filter(Boolean)
                    .map(
                        text =>
                            `<p>${escapeHtml(text)}</p>`
                    )
                    .join("");

        }

    }


    /* =====================================================
       SLUG
    ===================================================== */

    function slugify(text) {

        return String(text || "")
            .toLocaleLowerCase("tr-TR")
            .replace(/ğ/g, "g")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ç/g, "c")
            .replace(/â/g, "a")
            .replace(/î/g, "i")
            .replace(/û/g, "u")
            .replace(
                /[^a-z0-9\s-]/g,
                ""
            )
            .trim()
            .replace(
                /\s+/g,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                "");

    }


    /* =====================================================
       RESİM
    ===================================================== */

    function getImagePath(src) {

        if (!src) {

            return "";

        }


        src =
            String(src).trim();


        if (
            src.startsWith(
                "http://"
            ) ||
            src.startsWith(
                "https://"
            ) ||
            src.startsWith(
                "data:"
            )
        ) {

            return src;

        }


        return "/" +
            src.replace(
                /^\/+/,
                ""
            );

    }


    /* =====================================================
       HTML GÜVENLİĞİ
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* =====================================================
       HATA
    ===================================================== */

    function showError(message) {

        container.innerHTML = `

            <div class="article-error">


                <div class="article-error-icon">

                    !

                </div>


                <h1>

                    Haber bulunamadı

                </h1>


                <p>

                    ${
                        message ||
                        "Aradığınız haber kaldırılmış veya bağlantı hatalı olabilir."
                    }

                </p>


                <button
                    onclick="window.location.href='/'"
                >

                    Ana Sayfaya Dön

                </button>


            </div>

        `;

    }


})();



/* =========================================================
   SESLİ OKUMA SİSTEMİ
========================================================= */

let speechUtterance = null;

let voiceSpeed = 1;

let isReading = false;


/* =========================================================
   OKUNACAK METNİ AL
========================================================= */

function getArticleVoiceText() {

    const title =
        document.querySelector(
            ".article-title h1"
        )?.innerText || "";


    const spot =
        document.querySelector(
            ".article-spot p"
        )?.innerText || "";


    const content =
        document.querySelector(
            "#articleContent"
        )?.innerText || "";


    return [

        title,

        spot,

        content

    ]
        .filter(Boolean)
        .join(". ");

}


/* =========================================================
   TÜRKÇE SESİ BUL
========================================================= */

function getTurkishVoice() {

    const voices =
        window.speechSynthesis
            .getVoices();


    if (!voices.length) {

        return null;

    }


    return (
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("tr")
        )
        ||
        voices.find(
            voice =>
                voice.name
                    .toLowerCase()
                    .includes("turk")
        )
        ||
        null
    );

}


/* =========================================================
   BAŞLAT
========================================================= */

function startVoiceReader() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Tarayıcınız sesli okumayı desteklemiyor. Lütfen Chrome, Edge veya Safari kullanın."
        );

        return;

    }


    const text =
        getArticleVoiceText();


    if (!text.trim()) {

        alert(
            "Okunacak haber metni bulunamadı."
        );

        return;

    }


    window.speechSynthesis.cancel();


    speechUtterance =
        new SpeechSynthesisUtterance(
            text
        );


    speechUtterance.lang =
        "tr-TR";


    speechUtterance.rate =
        voiceSpeed;


    speechUtterance.pitch =
        1;


    speechUtterance.volume =
        1;


    const turkishVoice =
        getTurkishVoice();


    if (turkishVoice) {

        speechUtterance.voice =
            turkishVoice;

    }


    speechUtterance.onstart =
        function () {

            isReading =
                true;


            updateVoiceUI(
                true
            );

        };


    speechUtterance.onend =
        function () {

            isReading =
                false;


            updateVoiceUI(
                false
            );


            document.getElementById(
                "voiceStatus"
            ).textContent =
                "Haberin tamamı okundu.";

        };


    speechUtterance.onerror =
        function () {

            isReading =
                false;


            updateVoiceUI(
                false
            );


            document.getElementById(
                "voiceStatus"
            ).textContent =
                "Sesli okuma sırasında bir hata oluştu.";

        };


    window.speechSynthesis.speak(
        speechUtterance
    );

}


/* =========================================================
   DURAKLAT
========================================================= */

function pauseVoiceReader() {

    if (
        window.speechSynthesis.speaking &&
        !window.speechSynthesis.paused
    ) {

        window.speechSynthesis.pause();


        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Sesli okuma duraklatıldı.";

    }

}


/* =========================================================
   DEVAM
========================================================= */

function resumeVoiceReader() {

    if (
        window.speechSynthesis.paused
    ) {

        window.speechSynthesis.resume();


        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Sesli okuma devam ediyor.";

    }

}


/* =========================================================
   DURDUR
========================================================= */

function stopVoiceReader() {

    window.speechSynthesis.cancel();


    isReading =
        false;


    updateVoiceUI(
        false
    );


    document.getElementById(
        "voiceStatus"
    ).textContent =
        "Sesli okuma durduruldu.";

}


/* =========================================================
   OKUMA HIZI
========================================================= */

function setVoiceSpeed(speed) {

    voiceSpeed =
        Number(speed);


    document
        .querySelectorAll(
            ".speed-button"
        )
        .forEach(
            function (button) {

                button.classList.toggle(
                    "selected",
                    Number(
                        button.dataset.speed
                    )
                    ===
                    voiceSpeed
                );

            }
        );


    document.getElementById(
        "voiceStatus"
    ).textContent =
        "Okuma hızı " +
        voiceSpeed +
        "x olarak ayarlandı.";


    /*
       Eğer şu anda okuyorsa
       yeniden başlat.
    */

    if (
        isReading
    ) {

        startVoiceReader();

    }

}


/* =========================================================
   SES UI
========================================================= */

function updateVoiceUI(reading) {

    const start =
        document.getElementById(
            "voiceStart"
        );


    const indicator =
        document.getElementById(
            "readingIndicator"
        );


    if (!start) return;


    if (reading) {

        start.innerHTML =
            "🔊 Okunuyor...";

        start.classList.add(
            "active"
        );

        indicator?.classList.add(
            "show"
        );

    } else {

        start.innerHTML =
            "🔊 Haberi Oku";

        start.classList.remove(
            "active"
        );

        indicator?.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   YAZI BÜYÜT
========================================================= */

function increaseTextSize() {

    document.body.classList.add(
        "large-text"
    );

}


/* =========================================================
   YAZI NORMAL
========================================================= */

function resetTextSize() {

    document.body.classList.remove(
        "large-text"
    );

}


/* =========================================================
   YÜKSEK KONTRAST
========================================================= */

function toggleHighContrast() {

    document.body.classList.toggle(
        "high-contrast"
    );

}


/* =========================================================
   GERİ
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ) {

        history.back();

    } else {

        window.location.href =
            "/";

    }

}


/* =========================================================
   PAYLAŞ
========================================================= */

function shareNews() {

    const data = {

        title:
            document.title,

        text:
            document.title,

        url:
            window.location.href

    };


    if (
        navigator.share
    ) {

        navigator
            .share(data)
            .catch(
                () => {}
            );

    } else {

        copyLink();

    }

}


/* =========================================================
   LİNK KOPYALA
========================================================= */

function copyLink() {

    const url =
        window.location.href;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(url)
            .then(
                function () {

                    alert(
                        "Haber bağlantısı kopyalandı."
                    );

                }
            )
            .catch(
                function () {

                    alert(
                        "Bağlantı kopyalanamadı."
                    );

                }
            );

    } else {

        alert(
            "Bağlantı kopyalanamadı."
        );

    }

}


/* =========================================================
   SESLER YÜKLENDİĞİNDE
========================================================= */

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis
        .onvoiceschanged =
        function () {

            window.speechSynthesis
                .getVoices();

        };

}


/* =========================================================
   SAYFADAN ÇIKINCA SESİ KES
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        if (
            "speechSynthesis"
            in window
        ) {

            window.speechSynthesis
                .cancel();

        }

    }
);

</script>
