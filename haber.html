<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GÜNORA Haber</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#182230;
}

header{
    background:white;
    border-bottom:1px solid #e5e9ef;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1100px;
    margin:auto;
    height:75px;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:30px;
    font-weight:900;
}

.logo span{
    color:#4f8cff;
}

.back{
    border:0;
    background:#f1f4f8;
    padding:11px 17px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.back:hover{
    background:#4f8cff;
    color:white;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.article{
    background:white;
    border:1px solid #e5e9ef;
    border-radius:20px;
    overflow:hidden;
}

.article-image{
    width:100%;
    height:500px;
    object-fit:cover;
    display:block;
}

.content{
    padding:35px;
}

.category{
    display:inline-block;
    background:#4f8cff;
    color:white;
    padding:7px 12px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

h1{
    font-size:42px;
    line-height:1.12;
    margin-bottom:15px;
}

.date{
    color:#8a94a3;
    font-size:14px;
    margin-bottom:25px;
}

.description{
    font-size:19px;
    line-height:1.7;
    color:#4b5563;
    margin-bottom:25px;
    font-weight:600;
}

.text{
    white-space:pre-line;
    font-size:17px;
    line-height:1.9;
    color:#374151;
}

footer{
    text-align:center;
    padding:35px;
    color:#8a94a3;
}

@media(max-width:600px){

    .article-image{
        height:280px;
    }

    .content{
        padding:22px;
    }

    h1{
        font-size:29px;
    }

    .description{
        font-size:17px;
    }

    .text{
        font-size:16px;
    }

}

</style>

</head>

<body>

<header>

<div class="header">

    <div class="logo">
        GÜN<span>ORA</span>
    </div>

    <button
        class="back"
        onclick="history.back()">

        ← Haberler

    </button>

</div>

</header>


<main class="container">

<div
    class="article"
    id="article">

</div>

</main>


<footer>

    <strong>GÜNORA</strong>
    <br>
    Güncel haberlerin adresi

</footer>


<script src="HABERLER/haberler.js"></script>

<script>

const params =
    new URLSearchParams(window.location.search);

const id =
    Number(params.get("id"));

const haber =
    haberler.find(h => h.id === id);


if(!haber){

    document.getElementById("article").innerHTML = `

        <div class="content">

            <h1>Haber bulunamadı</h1>

            <p>
                Aradığınız haber mevcut değil.
            </p>

        </div>

    `;

}else{

    document.title =
        haber.baslik + " — GÜNORA";


    document.getElementById("article").innerHTML = `

        <img
            class="article-image"
            src="${haber.gorsel}"
            alt="${haber.baslik}"
        >

        <div class="content">

            <span class="category">
                ${haber.kategori}
            </span>

            <h1>
                ${haber.baslik}
            </h1>

            <div class="date">
                ${haber.tarih}
            </div>

            <div class="description">
                ${haber.aciklama}
            </div>

            <div class="text">
                ${haber.icerik}
            </div>

        </div>

    `;

}

</script>

</body>
</html>
