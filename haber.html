<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Haberİsta</title>

    <meta
        name="description"
        content="Haberİsta haber detay sayfası."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="main-header">

        <div class="container header-inner">

            <button
                class="menu-btn"
                onclick="window.location.href='index.html'"
            >
                ←
            </button>

            <a
                href="index.html"
                class="logo"
            >
                <span>Haber</span>İsta
            </a>

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Haber ara..."
                >

                <button id="searchBtn">
                    🔍
                </button>

            </div>

        </div>

    </div>


    <nav class="category-nav">

        <div class="container nav-inner">

            <a href="index.html">
                Ana Sayfa
            </a>

            <a href="index.html#son-dakika">
                Son Dakika
            </a>

            <a href="index.html">
                Gündem
            </a>

            <a href="index.html">
                Ekonomi
            </a>

            <a href="index.html">
                Spor
            </a>

            <a href="index.html">
                Magazin
            </a>

            <a href="index.html">
                Dünya
            </a>

            <a href="index.html">
                Teknoloji
            </a>

            <a href="index.html">
                Sağlık
            </a>

        </div>

    </nav>

</header>


<div class="breaking-bar">

    <div class="container breaking-inner">

        <div class="breaking-title">

            <span class="breaking-dot"></span>

            SON DAKİKA

        </div>

        <div
            id="breakingNews"
            class="breaking-news"
        ></div>

    </div>

</div>


<main class="container article-container">

    <div id="article"></div>


    <div class="article-share">

        <strong>
            Haberi Paylaş
        </strong>

        <button
            type="button"
            onclick="shareNews()"
        >
            ↗
        </button>

        <button
            type="button"
            onclick="copyNewsLink()"
        >
            🔗
        </button>

    </div>


    <section>

        <div class="section-header">

            <h2>
                Benzer Haberler
            </h2>

            <span></span>

        </div>

        <div
            id="relatedNews"
            class="news-grid"
        ></div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-grid">

        <div>

            <div class="footer-logo">
                <span>Haber</span>İsta
            </div>

            <p>
                Güncel haberlerin adresi.
            </p>

        </div>


        <div>

            <h4>
                Haberİsta
            </h4>

            <a href="#">
                Hakkımızda
            </a>

            <a href="#">
                İletişim
            </a>

            <a href="#">
                Gizlilik Politikası
            </a>

        </div>

    </div>


    <div class="footer-bottom">

        <div class="container">

            © 2026 Haberİsta

        </div>

    </div>

</footer>


<script src="js/haberler.js"></script>
<script src="js/haber.js"></script>

</body>
</html>
