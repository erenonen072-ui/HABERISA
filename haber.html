<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haber Detayı | Haberİsta</title>

    <meta name="description"
          content="Haberİsta haber detay sayfası. Türkiye ve dünyadan güncel gelişmeler.">

    <meta name="robots" content="index, follow">

    <meta property="og:type" content="article">
    <meta property="og:title" content="Haber Detayı | Haberİsta">
    <meta property="og:description" content="Türkiye ve dünyadan güncel haberler.">
    <meta property="og:site_name" content="Haberİsta">

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================
           HABER DETAY SAYFASI
           Mevcut site tasarımını bozmadan
           profesyonel haber okuma görünümü
        ========================================= */

        .haber-detail-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 20px 70px;
        }

        /* Breadcrumb */

        .haber-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            font-size: 14px;
            color: #7b8491;
        }

        .haber-breadcrumb a {
            color: inherit;
            text-decoration: none;
            transition: .2s ease;
        }

        .haber-breadcrumb a:hover {
            color: #111827;
        }

        .haber-breadcrumb span {
            opacity: .55;
        }

        /* Ana kart */

        .haber-article {
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(15, 23, 42, .08);
            border: 1px solid rgba(15, 23, 42, .06);
        }

        /* Üst alan */

        .haber-header {
            padding: 36px 42px 30px;
        }

        .haber-category {
            display: inline-flex;
            align-items: center;
            padding: 7px 13px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .2px;
            margin-bottom: 17px;
        }

        .haber-title {
            margin: 0;
            color: #111827;
            font-size: clamp(30px, 4vw, 50px);
            line-height: 1.1;
            letter-spacing: -.9px;
            font-weight: 900;
            max-width: 1000px;
        }

        .haber-spot {
            margin: 19px 0 0;
            max-width: 900px;
            color: #5b6472;
            font-size: 18px;
            line-height: 1.65;
            font-weight: 500;
        }

        /* Meta */

        .haber-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf0f3;
            color: #697386;
            font-size: 13px;
        }

        .haber-meta-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .haber-meta-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .haber-author {
            font-weight: 800;
            color: #374151;
        }

        /* Görsel */

        .haber-image-wrapper {
            width: 100%;
            background: #f1f5f9;
        }

        .haber-image {
            display: block;
            width: 100%;
            max-height: 620px;
            object-fit: cover;
        }

        /* İçerik alanı */

        .haber-content-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 42px 42px 50px;
        }

        .haber-content {
            color: #293241;
            font-size: 18px;
            line-height: 1.9;
        }

        .haber-content p {
            margin: 0 0 24px;
        }

        .haber-content p:first-child {
            font-size: 20px;
            line-height: 1.8;
            color: #374151;
            font-weight: 500;
        }

        .haber-content h2 {
            margin: 38px 0 15px;
            color: #111827;
            font-size: 27px;
            line-height: 1.3;
            font-weight: 850;
            letter-spacing: -.3px;
        }

        .haber-content h3 {
            margin: 30px 0 12px;
            color: #111827;
            font-size: 22px;
            line-height: 1.4;
            font-weight: 800;
        }

        .haber-content strong {
            color: #111827;
            font-weight: 800;
        }

        .haber-content ul,
        .haber-content ol {
            margin: 20px 0 28px;
            padding-left: 28px;
        }

        .haber-content li {
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .haber-content blockquote {
            margin: 30px 0;
            padding: 22px 25px;
            border-left: 4px solid #2563eb;
            border-radius: 0 12px 12px 0;
            background: #f8fafc;
            color: #4b5563;
            font-size: 18px;
            font-style: italic;
        }

        .haber-content a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .haber-content img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 30px 0;
        }

        /* Haber sonu */

        .haber-source-box {
            margin-top: 38px;
            padding: 20px 22px;
            background: #f8fafc;
            border: 1px solid #e7ebf0;
            border-radius: 14px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .haber-source-box strong {
            color: #374151;
        }

        /* Paylaş */

        .haber-share {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 42px 35px;
        }

        .haber-share-title {
            margin-bottom: 12px;
            color: #374151;
            font-size: 14px;
            font-weight: 800;
        }

        .haber-share-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .haber-share-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            text-decoration: none;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .haber-share-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(15, 23, 42, .08);
        }

        /* Geri dön */

        .haber-back {
            margin-top: 22px;
        }

        .haber-back a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 11px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            transition: .2s ease;
        }

        .haber-back a:hover {
            transform: translateY(-2px);
        }

        /* Bulunamadı */

        .haber-error {
            max-width: 700px;
            margin: 80px auto;
            padding: 45px 25px;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, .08);
        }

        .haber-error h1 {
            margin: 0 0 10px;
            color: #111827;
        }

        .haber-error p {
            color: #64748b;
            line-height: 1.6;
        }

        /* Mobil */

        @media (max-width: 768px) {

            .haber-detail-page {
                padding: 18px 12px 45px;
            }

            .haber-article {
                border-radius: 15px;
            }

            .haber-header {
                padding: 25px 20px 22px;
            }

            .haber-title {
                font-size: 31px;
                letter-spacing: -.5px;
            }

            .haber-spot {
                font-size: 16px;
                line-height: 1.6;
            }

            .haber-meta {
                gap: 9px;
            }

            .haber-meta-dot {
                display: none;
            }

            .haber-image {
                max-height: 400px;
            }

            .haber-content-wrapper {
                padding: 28px 20px 35px;
            }

            .haber-content {
                font-size: 17px;
                line-height: 1.8;
            }

            .haber-content p:first-child {
                font-size: 18px;
            }

            .haber-content h2 {
                font-size: 23px;
                margin-top: 31px;
            }

            .haber-content h3 {
                font-size: 20px;
            }

            .haber-content blockquote {
                padding: 17px 18px;
                font-size: 16px;
            }

            .haber-share {
                padding: 0 20px 28px;
            }

            .haber-share-button {
                flex: 1 1 auto;
            }
        }

        @media (max-width: 430px) {

            .haber-title {
                font-size: 27px;
            }

            .haber-category {
                font-size: 12px;
            }

            .haber-content {
                font-size: 16px;
            }

            .haber-image {
                max-height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Mevcut sitenin header'ı -->
    <header id="site-header"></header>

    <main class="haber-detail-page">

        <!-- Breadcrumb -->
        <nav class="haber-breadcrumb" aria-label="Breadcrumb">
            <a href="/">Ana Sayfa</a>
            <span>›</span>
            <span id="breadcrumb-category">Haber</span>
            <span>›</span>
            <span>Haber Detayı</span>
        </nav>

        <!-- Haber -->
        <article class="haber-article" id="haber-container">

            <!-- JS burayı dolduracak -->

            <div class="haber-error">
                <h1>Haber yükleniyor...</h1>
                <p>
                    Haber içeriği hazırlanıyor, lütfen bekleyin.
                </p>
            </div>

        </article>

    </main>

    <!-- Mevcut site JS -->
    <script src="js/haberler.js"></script>

    <script>
        "use strict";

        document.addEventListener("DOMContentLoaded", function () {

            const container = document.getElementById("haber-container");

            /*
             * URL'den haber ID'sini alır.
             * Örnek:
             * /haber.html?id=10
             */
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            /*
             * haberler.js içindeki haberler dizisini bul.
             */
            let haberListesi = [];

            if (typeof haberler !== "undefined" && Array.isArray(haberler)) {
                haberListesi = haberler;
            } else if (
                typeof haberlerData !== "undefined" &&
                Array.isArray(haberlerData)
            ) {
                haberListesi = haberlerData;
            } else if (
                typeof HABERLER !== "undefined" &&
                Array.isArray(HABERLER)
            ) {
                haberListesi = HABERLER;
            }

            /*
             * ID eşleşmesi
             */
            const haber = haberListesi.find(function (item) {
                return String(item.id) === String(id);
            });

            if (!haber) {

                container.innerHTML = `
                    <div class="haber-error">
                        <h1>Haber bulunamadı</h1>
                        <p>
                            Aradığınız haber mevcut değil veya kaldırılmış olabilir.
                        </p>
                        <div class="haber-back">
                            <a href="/">
                                ← Ana Sayfaya Dön
                            </a>
                        </div>
                    </div>
                `;

                return;
            }

            /*
             * Sayfa başlığı
             */
            document.title =
                haber.baslik + " | Haberİsta";

            /*
             * Breadcrumb
             */
            const breadcrumbCategory =
                document.getElementById("breadcrumb-category");

            if (breadcrumbCategory) {
                breadcrumbCategory.textContent =
                    haber.kategori || "Haber";
            }

            /*
             * Meta bilgileri
             */
            const description =
                haber.spot ||
                haber.baslik ||
                "Haberİsta güncel haberler.";

            const metaDescription =
                document.querySelector('meta[name="description"]');

            if (metaDescription) {
                metaDescription.setAttribute(
                    "content",
                    description
                );
            }

            /*
             * Görsel
             */
            const image =
                haber.gorsel ||
                haber.gorselUrl ||
                haber.image ||
                "";

            /*
             * Tarih
             */
            const tarih =
                haber.tarih || "";

            /*
             * Saat
             */
            const saat =
                haber.saat || "";

            /*
             * Yazar
             */
            const yazar =
                haber.yazar ||
                "Haberİsta Editör";

            /*
             * Kaynak
             */
            const kaynak =
                haber.kaynak ||
                "Haberİsta";

            /*
             * İçerik
             */
            const icerik =
                haber.icerik ||
                haber.metin ||
                haber.content ||
                "<p>Bu haber için içerik bulunamadı.</p>";

            /*
             * Görsel HTML
             */
            const imageHTML = image
                ? `
                    <div class="haber-image-wrapper">
                        <img
                            class="haber-image"
                            src="${image}"
                            alt="${escapeHTML(haber.baslik || "Haber görseli")}"
                            loading="eager"
                        >
                    </div>
                `
                : "";

            /*
             * Haber HTML
             */
            container.innerHTML = `

                <header class="haber-header">

                    <div class="haber-category">
                        ${escapeHTML(haber.kategori || "HABER")}
                    </div>

                    <h1 class="haber-title">
                        ${escapeHTML(haber.baslik || "Haber")}
                    </h1>

                    <p class="haber-spot">
                        ${escapeHTML(haber.spot || "")}
                    </p>

                    <div class="haber-meta">

                        <div class="haber-meta-item">
                            <span>✍️</span>
                            <span class="haber-author">
                                ${escapeHTML(yazar)}
                            </span>
                        </div>

                        <span class="haber-meta-dot"></span>

                        <div class="haber-meta-item">
                            <span>📅</span>
                            <span>
                                ${escapeHTML(tarih)}
                            </span>
                        </div>

                        ${
                            saat
                            ? `
                                <span class="haber-meta-dot"></span>

                                <div class="haber-meta-item">
                                    <span>🕐</span>
                                    <span>
                                        ${escapeHTML(saat)}
                                    </span>
                                </div>
                            `
                            : ""
                        }

                    </div>

                </header>

                ${imageHTML}

                <div class="haber-content-wrapper">

                    <div class="haber-content">
                        ${icerik}
                    </div>

                    <div class="haber-source-box">

                        <strong>Kaynak:</strong>
                        ${escapeHTML(kaynak)}

                        <br>

                        <strong>Yayın:</strong>
                        Haberİsta

                    </div>

                </div>

                <div class="haber-share">

                    <div class="haber-share-title">
                        Bu haberi paylaş
                    </div>

                    <div class="haber-share-buttons">

                        <button
                            class="haber-share-button"
                            onclick="copyHaberLink()"
                            type="button"
                        >
                            🔗 Bağlantıyı Kopyala
                        </button>

                        <a
                            class="haber-share-button"
                            id="whatsapp-share"
                            target="_blank"
                            rel="noopener"
                        >
                            WhatsApp
                        </a>

                    </div>

                </div>

            `;

            /*
             * WhatsApp paylaşım linki
             */
            const currentURL =
                window.location.href;

            const whatsapp =
                document.getElementById("whatsapp-share");

            if (whatsapp) {
                whatsapp.href =
                    "https://wa.me/?text=" +
                    encodeURIComponent(
                        haber.baslik + " - " + currentURL
                    );
            }

        });


        /*
         * HTML güvenliği
         */
        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /*
         * Haber bağlantısını kopyala
         */
        function copyHaberLink() {

            const url =
                window.location.href;

            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {

                navigator.clipboard
                    .writeText(url)
                    .then(function () {

                        alert(
                            "Haber bağlantısı kopyalandı."
                        );

                    })
                    .catch(function () {

                        fallbackCopy(url);

                    });

            } else {

                fallbackCopy(url);

            }
        }


        /*
         * Eski tarayıcılar için
         */
        function fallbackCopy(text) {

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);

            textarea.select();

            try {

                document.execCommand("copy");

                alert(
                    "Haber bağlantısı kopyalandı."
                );

            } catch (error) {

                alert(
                    "Bağlantı kopyalanamadı."
                );

            }

            document.body.removeChild(textarea);
        }
    </script>

</body>
</html>
