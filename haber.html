<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haberİsta</title>
    <meta name="description" content="Haberİsta haber detay sayfası">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/haber.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HABER SAYFASI */

        .article-page {
            min-height: 100vh;
            padding: 30px 18px 70px;
        }

        .article-wrapper {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        /* ÜST BAR */

        .article-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .article-logo {
            text-decoration: none;
            font-size: 28px;
            font-weight: 900;
            color: #111827;
            letter-spacing: -1px;
        }

        .article-logo span {
            color: #e11d48;
        }

        .back-button {
            border: 0;
            background: white;
            color: #111827;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
            transition: .2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,.11);
        }

        /* HABER KARTI */

        .article-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 35px rgba(15, 23, 42, .08);
            border: 1px solid #e5e7eb;
        }

        /* KATEGORİ */

        .article-category {
            padding: 26px 40px 0;
        }

        .article-category span {
            display: inline-flex;
            align-items: center;
            background: #e11d48;
            color: white;
            padding: 7px 13px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        /* BAŞLIK */

        .article-title {
            padding: 18px 40px 0;
        }

        .article-title h1 {
            margin: 0;
            font-size: clamp(32px, 5vw, 56px);
            line-height: 1.08;
            letter-spacing: -1.7px;
            font-weight: 900;
            color: #0f172a;
        }

        /* SPOT */

        .article-spot {
            padding: 18px 40px 0;
        }

        .article-spot p {
            margin: 0;
            font-size: 19px;
            line-height: 1.6;
            color: #64748b;
            font-weight: 500;
        }

        /* META */

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            padding: 20px 40px 28px;
            color: #64748b;
            font-size: 14px;
        }

        .article-meta strong {
            color: #334155;
        }

        .meta-separator {
            width: 4px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 50%;
        }

        /* ANA FOTOĞRAF */

        .article-image-wrapper {
            width: 100%;
            background: #e5e7eb;
            position: relative;
            overflow: hidden;
        }

        .article-image {
            display: block;
            width: 100%;
            max-height: 650px;
            object-fit: cover;
            object-position: center;
        }

        /* İÇERİK */

        .article-content {
            padding: 42px 40px 55px;
            max-width: 900px;
            margin: auto;
        }

        .article-content p {
            margin: 0 0 24px;
            font-size: 18px;
            line-height: 1.85;
            color: #263244;
        }

        .article-content h2 {
            margin: 42px 0 18px;
            font-size: 29px;
            line-height: 1.25;
            color: #0f172a;
        }

        .article-content h3 {
            margin: 34px 0 15px;
            font-size: 23px;
            color: #0f172a;
        }

        .article-content strong {
            color: #111827;
        }

        .article-content ul,
        .article-content ol {
            margin: 20px 0 28px;
            padding-left: 30px;
        }

        .article-content li {
            margin-bottom: 12px;
            font-size: 17px;
            line-height: 1.7;
        }

        .article-content blockquote {
            margin: 30px 0;
            padding: 20px 25px;
            border-left: 4px solid #e11d48;
            background: #f8fafc;
            color: #475569;
            font-size: 18px;
            line-height: 1.7;
        }

        /* KAYNAK */

        .article-source {
            margin: 0 40px 40px;
            padding: 18px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: #64748b;
            font-size: 14px;
        }

        .article-source strong {
            color: #334155;
        }

        /* PAYLAŞ */

        .article-share {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 40px 40px;
        }

        .share-title {
            font-size: 14px;
            font-weight: 800;
            color: #475569;
            margin-right: 5px;
        }

        .share-btn {
            border: 0;
            background: #f1f5f9;
            color: #334155;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 17px;
            font-weight: 800;
            transition: .2s;
        }

        .share-btn:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        /* ALT BİLGİ */

        .article-footer {
            text-align: center;
            padding: 30px 10px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        /* YÜKLENİYOR */

        .article-loading {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 18px;
        }

        /* BULUNAMADI */

        .article-error {
            text-align: center;
            background: white;
            padding: 70px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 35px rgba(15, 23, 42, .08);
        }

        .article-error h1 {
            font-size: 36px;
            margin: 0 0 12px;
        }

        .article-error p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .article-error button {
            border: 0;
            background: #e11d48;
            color: white;
            padding: 13px 22px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        /* MOBİL */

        @media (max-width: 700px) {

            .article-page {
                padding: 15px 10px 40px;
            }

            .article-top {
                margin-bottom: 15px;
            }

            .article-logo {
                font-size: 23px;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 12px;
            }

            .article-card {
                border-radius: 14px;
            }

            .article-category {
                padding: 22px 20px 0;
            }

            .article-title {
                padding: 14px 20px 0;
            }

            .article-title h1 {
                font-size: 32px;
                letter-spacing: -1px;
            }

            .article-spot {
                padding: 15px 20px 0;
            }

            .article-spot p {
                font-size: 16px;
            }

            .article-meta {
                padding: 17px 20px 22px;
                font-size: 12px;
                gap: 8px 12px;
            }

            .article-image {
                max-height: 430px;
            }

            .article-content {
                padding: 28px 20px 35px;
            }

            .article-content p {
                font-size: 16px;
                line-height: 1.75;
            }

            .article-content h2 {
                font-size: 24px;
            }

            .article-content h3 {
                font-size: 20px;
            }

            .article-source {
                margin: 0 20px 25px;
            }

            .article-share {
                padding: 0 20px 28px;
            }
        }
    </style>
</head>

<body>

<main class="article-page">

    <div class="article-wrapper">

        <!-- SADECE HABER SAYFASINA AİT ÜST KISIM -->
        <div class="article-top">
            <a href="/" class="article-logo">
                <span>Haber</span>İsta
            </a>

            <button class="back-button" onclick="goBack()">
                ← Geri
            </button>
        </div>

        <!-- HABER -->
        <article id="articleContainer">

            <div class="article-loading">
                Haber yükleniyor...
            </div>

        </article>

        <div class="article-footer">
            © 2026 Haberİsta · Tüm hakları saklıdır.
        </div>

    </div>

</main>


<!-- HABER VERİLERİ -->
<script src="/js/haberler.js"></script>

<script>

(function () {

    "use strict";

    const container = document.getElementById("articleContainer");

    /*
     * URL:
     *
     * /haber/5-eylul-2026-resm-gazete-yayimlandi-yeni-kararlar-atamalar-ve-onemli-duzenlemeler
     */

    const pathname = window.location.pathname;

    const match = pathname.match(/^\/haber\/([^\/]+)\/?$/i);

    if (!match) {
        showError();
        return;
    }

    const slug = decodeURIComponent(match[1]);

    console.log("Haber slug:", slug);
    console.log("Haberler:", window.haberler);

    const news = Array.isArray(window.haberler)
        ? window.haberler
        : [];

    let haber = null;

    /*
     * Önce slug ile bul
     */
    haber = news.find(item => {

        if (item.slug) {
            return String(item.slug).toLowerCase() === slug.toLowerCase();
        }

        return false;

    });

    /*
     * Slug yoksa başlıktan üret
     */
    if (!haber && typeof window.slugOlustur === "function") {

        haber = news.find(item => {

            return window.slugOlustur(item.baslik) === slug;

        });

    }

    if (!haber) {
        console.error("Haber bulunamadı:", slug);
        showError();
        return;
    }

    renderArticle(haber);


    /* -----------------------------------------
       HABERİ OLUŞTUR
    ----------------------------------------- */

    function renderArticle(haber) {

        const baslik =
            haber.baslik ||
            haber.title ||
            "Haber";

        const kategori =
            haber.kategori ||
            haber.category ||
            "Haber";

        const tarih =
            haber.tarih ||
            haber.date ||
            "";

        const saat =
            haber.saat ||
            haber.time ||
            "";

        const okunma =
            haber.okunma ??
            haber.views ??
            "";

        const kaynak =
            haber.kaynak ||
            haber.source ||
            "Haberİsta";

        const spot =
            haber.spot ||
            haber.description ||
            "";

        const resim =
            haber.resim ||
            haber.image ||
            haber.gorsel ||
            "";

        const icerik =
            haber.icerik ||
            haber.content ||
            "";


        document.title = baslik + " | Haberİsta";


        const imagePath = getImagePath(resim);


        container.innerHTML = `

            <div class="article-card">

                <div class="article-category">
                    <span>
                        ${escapeHtml(kategori)}
                    </span>
                </div>

                <div class="article-title">
                    <h1>
                        ${escapeHtml(baslik)}
                    </h1>
                </div>

                ${
                    spot
                    ? `
                        <div class="article-spot">
                            <p>
                                ${escapeHtml(spot)}
                            </p>
                        </div>
                    `
                    : ""
                }

                <div class="article-meta">

                    ${
                        tarih
                        ? `<span><strong>${escapeHtml(tarih)}</strong></span>`
                        : ""
                    }

                    ${
                        saat
                        ? `
                            <span class="meta-separator"></span>
                            <span>${escapeHtml(saat)}</span>
                        `
                        : ""
                    }

                    ${
                        okunma !== ""
                        ? `
                            <span class="meta-separator"></span>
                            <span>👁 ${escapeHtml(String(okunma))} okunma</span>
                        `
                        : ""
                    }

                </div>


                <!-- HABERİN EKLEDİĞİN FOTOĞRAFI -->

                <div class="article-image-wrapper">

                    <img
                        class="article-image"
                        src="${escapeAttribute(imagePath)}"
                        alt="${escapeAttribute(baslik)}"
                        loading="eager"
                        onerror="this.onerror=null;this.src='/images/default-news.jpg';"
                    >

                </div>


                <!-- HABER METNİ -->

                <div class="article-content" id="articleContent"></div>


                ${
                    kaynak
                    ? `
                        <div class="article-source">
                            <strong>Kaynak:</strong>
                            ${escapeHtml(kaynak)}
                        </div>
                    `
                    : ""
                }


                <div class="article-share">

                    <span class="share-title">
                        Haberi paylaş:
                    </span>

                    <button
                        class="share-btn"
                        onclick="shareNews()"
                        title="Paylaş"
                    >
                        ↗
                    </button>

                    <button
                        class="share-btn"
                        onclick="copyLink()"
                        title="Bağlantıyı kopyala"
                    >
                        🔗
                    </button>

                </div>

            </div>
        `;


        /*
         * İçeriği ekle
         */

        const contentBox =
            document.getElementById("articleContent");

        if (icerik) {

            /*
             * Haberler.js içinde HTML içerik varsa
             * HTML olarak göster.
             */

            if (/<[a-z][\s\S]*>/i.test(icerik)) {

                contentBox.innerHTML = icerik;

            } else {

                const paragraphs =
                    String(icerik)
                    .split(/\n+/)
                    .filter(Boolean);

                contentBox.innerHTML =
                    paragraphs
                    .map(text => {

                        return `
                            <p>
                                ${escapeHtml(text)}
                            </p>
                        `;

                    })
                    .join("");

            }

        } else {

            contentBox.innerHTML = `
                <p>
                    Bu haber için henüz detaylı içerik eklenmemiştir.
                </p>
            `;

        }

    }


    /* -----------------------------------------
       FOTOĞRAF YOLU
    ----------------------------------------- */

    function getImagePath(src) {

        if (!src) {
            return "/images/default-news.jpg";
        }

        src = String(src).trim();

        /*
         * Harici fotoğraf
         */

        if (
            src.startsWith("http://") ||
            src.startsWith("https://") ||
            src.startsWith("data:")
        ) {

            return src;

        }

        /*
         * images/haber.jpg
         *
         *       ↓
         *
         * /images/haber.jpg
         */

        return "/" + src.replace(/^\/+/, "");

    }


    /* -----------------------------------------
       HTML GÜVENLİĞİ
    ----------------------------------------- */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* -----------------------------------------
       HATA
    ----------------------------------------- */

    function showError() {

        container.innerHTML = `

            <div class="article-error">

                <h1>Haber bulunamadı</h1>

                <p>
                    Aradığınız haber kaldırılmış veya bağlantı hatalı olabilir.
                </p>

                <button onclick="window.location.href='/'">
                    Ana Sayfaya Dön
                </button>

            </div>

        `;

    }

})();


/* -----------------------------------------
   GERİ
----------------------------------------- */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(window.location.host)
    ) {

        history.back();

    } else {

        window.location.href = "/";

    }

}


/* -----------------------------------------
   PAYLAŞ
----------------------------------------- */

function shareNews() {

    const data = {
        title: document.title,
        url: window.location.href
    };

    if (navigator.share) {

        navigator.share(data).catch(() => {});

    } else {

        copyLink();

    }

}


/* -----------------------------------------
   LİNK KOPYALA
----------------------------------------- */

function copyLink() {

    navigator.clipboard.writeText(window.location.href)
        .then(() => {

            alert("Haber bağlantısı kopyalandı.");

        })
        .catch(() => {

            alert("Bağlantı kopyalanamadı.");

        });

}

</script>

</body>
</html>
