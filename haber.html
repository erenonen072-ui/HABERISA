<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Haberİsta haber detay sayfası"
    >

    <meta name="theme-color" content="#e11d48">

    <title>Haberİsta</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/haber.css">

    <style>

        /* =====================================================
           TEMEL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #0b0b0b;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =====================================================
           SAYFA
        ===================================================== */

        .article-page {
            min-height: 100vh;
            padding: 24px 16px 70px;
        }

        .article-wrapper {
            width: min(1200px, 100%);
            margin: auto;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .article-top {
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .article-logo {
            text-decoration: none;

            font-size: 31px;
            font-weight: 950;

            letter-spacing: -1.8px;

            color: #080808;
        }

        .article-logo span {
            color: #e11d48;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 7px;

            border: 1px solid #dedede;

            background: #fff;
            color: #111;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .back-button:hover {
            background: #111;
            color: #fff;
        }

        /* =====================================================
           HABER KARTI
        ===================================================== */

        .article-card {
            background: #fff;

            border: 1px solid #dedede;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0,0,0,.06);
        }

        /* =====================================================
           HABER HEADER
        ===================================================== */

        .article-header {
            padding:
                38px 50px 32px;
        }

        /* =====================================================
           KATEGORİ
        ===================================================== */

        .article-category {
            margin-bottom: 18px;
        }

        .article-category span {
            display: inline-flex;

            align-items: center;

            padding:
                7px 12px;

            background: #e11d48;

            color: #fff;

            border-radius: 4px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: .7px;

            text-transform: uppercase;
        }

        /* =====================================================
           ANA BAŞLIK
        ===================================================== */

        .article-title h1 {
            max-width: 1080px;

            margin: 0;

            color: #050505;

            font-size:
                clamp(34px, 5vw, 58px);

            line-height: 1.04;

            letter-spacing: -2.3px;

            font-weight: 950;

            text-wrap: balance;
        }

        /* =====================================================
           SPOT
        ===================================================== */

        .article-spot {
            max-width: 950px;

            margin-top: 22px;
        }

        .article-spot p {
            margin: 0;

            color: #242424;

            font-size: 20px;

            line-height: 1.55;

            font-weight: 600;

            letter-spacing: -.2px;
        }

        /* =====================================================
           META
        ===================================================== */

        .article-meta {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 9px 14px;

            margin-top: 24px;

            color: #555;

            font-size: 13px;

            font-weight: 500;
        }

        .article-meta strong {
            color: #171717;

            font-weight: 800;
        }

        .meta-separator {
            width: 4px;
            height: 4px;

            background: #aaa;

            border-radius: 50%;
        }

        .article-source-mini {
            color: #333;

            font-weight: 800;
        }

        /* =====================================================
           FOTOĞRAF
        ===================================================== */

        .article-image-wrapper {
            width: 100%;

            background: #e9e9e9;

            overflow: hidden;
        }

        .article-image {
            display: block;

            width: 100%;

            max-height: 680px;

            min-height: 300px;

            object-fit: cover;

            object-position: center;
        }

        .image-caption {
            padding:
                9px 50px;

            background: #fafafa;

            border-bottom:
                1px solid #e4e4e4;

            color: #888;

            font-size: 11px;

            font-weight: 500;
        }

        /* =====================================================
           İÇERİK DÜZENİ
        ===================================================== */

        .article-body-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 850px)
                240px;

            gap: 50px;

            justify-content: center;

            padding:
                44px 50px 50px;
        }

        /* =====================================================
           HABER METNİ
        ===================================================== */

        .article-content {
            min-width: 0;
        }

        .article-content p {
            margin:
                0 0 26px;

            color: #111111;

            font-size: 18px;

            line-height: 1.92;

            font-weight: 500;

            letter-spacing: -.05px;
        }

        /* İlk paragraf */

        .article-content p:first-child {
            color: #080808;

            font-size: 20px;

            line-height: 1.8;

            font-weight: 650;
        }

        /* =====================================================
           ALT BAŞLIKLAR
        ===================================================== */

        .article-content h2 {
            margin:
                45px 0 20px;

            padding-left: 15px;

            border-left:
                5px solid #e11d48;

            color: #050505;

            font-size: 29px;

            line-height: 1.25;

            font-weight: 950;

            letter-spacing: -.8px;
        }

        .article-content h3 {
            margin:
                35px 0 16px;

            color: #080808;

            font-size: 23px;

            line-height: 1.3;

            font-weight: 900;

            letter-spacing: -.4px;
        }

        /* =====================================================
           KALIN METİN
        ===================================================== */

        .article-content strong {
            color: #000;

            font-weight: 900;
        }

        /* =====================================================
           LİSTELER
        ===================================================== */

        .article-content ul,
        .article-content ol {
            margin:
                24px 0 30px;

            padding-left: 30px;
        }

        .article-content li {
            margin-bottom: 13px;

            color: #111;

            font-size: 17px;

            line-height: 1.75;

            font-weight: 500;
        }

        /* =====================================================
           ALINTI
        ===================================================== */

        .article-content blockquote {
            margin:
                35px 0;

            padding:
                22px 25px;

            background: #f6f6f6;

            border-left:
                5px solid #e11d48;

            border-radius:
                0 8px 8px 0;

            color: #191919;

            font-size: 18px;

            line-height: 1.75;

            font-weight: 600;
        }

        /* =====================================================
           YAN BİLGİ
        ===================================================== */

        .article-sidebar {
            position: sticky;

            top: 20px;

            align-self: start;
        }

        .sidebar-box {
            background: #fafafa;

            border:
                1px solid #dedede;

            border-radius: 9px;

            overflow: hidden;
        }

        .sidebar-title {
            padding:
                14px 16px;

            border-bottom:
                1px solid #dedede;

            color: #0a0a0a;

            font-size: 13px;

            font-weight: 900;
        }

        .sidebar-content {
            padding: 16px;
        }

        .sidebar-content p {
            margin: 0;

            color: #444;

            font-size: 13px;

            line-height: 1.7;
        }

        /* =====================================================
           KAYNAK
        ===================================================== */

        .article-source {
            margin:
                0 50px 30px;

            padding:
                16px 18px;

            background: #f7f7f7;

            border:
                1px solid #ddd;

            border-radius: 8px;

            color: #444;

            font-size: 13px;
        }

        .article-source strong {
            color: #000;

            font-weight: 900;
        }

        /* =====================================================
           PAYLAŞ
        ===================================================== */

        .article-share {
            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                0 50px 40px;
        }

        .share-title {
            margin-right: 5px;

            color: #333;

            font-size: 13px;

            font-weight: 900;
        }

        .share-btn {
            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid #ddd;

            border-radius: 50%;

            background: #fff;

            color: #111;

            cursor: pointer;

            transition: .2s;
        }

        .share-btn:hover {
            background: #111;

            color: #fff;

            border-color: #111;

            transform:
                translateY(-2px);
        }

        /* =====================================================
           SON ÇİZGİ
        ===================================================== */

        .article-end {
            height: 1px;

            margin:
                0 50px;

            background: #dedede;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .article-footer {
            padding:
                28px 10px 0;

            text-align: center;

            color: #888;

            font-size: 12px;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .article-loading {
            min-height: 65vh;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #555;

            font-size: 16px;

            font-weight: 600;
        }

        /* =====================================================
           HATA
        ===================================================== */

        .article-error {
            padding:
                80px 25px;

            background: #fff;

            text-align: center;

            border:
                1px solid #ddd;

            border-radius: 12px;
        }

        .article-error-icon {
            width: 60px;
            height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 18px;

            background: #fff1f2;

            color: #e11d48;

            border-radius: 50%;

            font-size: 25px;

            font-weight: 900;
        }

        .article-error h1 {
            margin:
                0 0 10px;

            color: #050505;

            font-size: 32px;

            font-weight: 950;
        }

        .article-error p {
            max-width: 500px;

            margin:
                0 auto 25px;

            color: #555;

            line-height: 1.6;
        }

        .article-error button {
            border: 0;

            background: #e11d48;

            color: #fff;

            padding:
                12px 22px;

            border-radius: 7px;

            font-weight: 800;

            cursor: pointer;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 900px) {

            .article-body-layout {
                grid-template-columns: 1fr;

                gap: 25px;
            }

            .article-sidebar {
                position: static;
            }

        }

        @media (max-width: 700px) {

            .article-page {
                padding:
                    8px 7px 40px;
            }

            .article-top {
                height: 55px;
            }

            .article-logo {
                font-size: 23px;
            }

            .back-button {
                padding:
                    8px 11px;

                font-size: 12px;
            }

            .article-card {
                border-radius: 10px;
            }

            .article-header {
                padding:
                    25px 18px 23px;
            }

            .article-category {
                margin-bottom: 14px;
            }

            .article-title h1 {
                font-size: 32px;

                line-height: 1.08;

                letter-spacing: -1.2px;
            }

            .article-spot {
                margin-top: 16px;
            }

            .article-spot p {
                font-size: 17px;

                line-height: 1.55;

                font-weight: 600;
            }

            .article-meta {
                margin-top: 18px;

                font-size: 11px;
            }

            .article-image {
                min-height: 220px;

                max-height: 450px;
            }

            .image-caption {
                padding:
                    8px 18px;
            }

            .article-body-layout {
                padding:
                    28px 18px 35px;
            }

            .article-content p {
                font-size: 17px;

                line-height: 1.85;

                margin-bottom: 22px;
            }

            .article-content p:first-child {
                font-size: 18px;

                line-height: 1.8;
            }

            .article-content h2 {
                margin-top: 36px;

                font-size: 24px;

                padding-left: 12px;
            }

            .article-content h3 {
                font-size: 20px;
            }

            .article-content li {
                font-size: 16px;
            }

            .article-content blockquote {
                padding:
                    17px 18px;

                font-size: 16px;
            }

            .article-source {
                margin:
                    0 18px 25px;

                font-size: 12px;
            }

            .article-share {
                padding:
                    0 18px 28px;
            }

            .article-end {
                margin:
                    0 18px;
            }

        }

    </style>
</head>

<body>

<main class="article-page">

    <div class="article-wrapper">

        <div class="article-top">

            <a
                href="/"
                class="article-logo"
            >
                <span>Haber</span>İsta
            </a>

            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ← Geri
            </button>

        </div>


        <article id="articleContainer">

            <div class="article-loading">
                Haber yükleniyor...
            </div>

        </article>


        <div class="article-footer">
            © 2026 Haberİsta · Tüm hakları saklıdır.
        </div>

    </div>

</main>


<script src="/js/haberler.js"></script>

<script>

(function () {

    "use strict";


    const container =
        document.getElementById(
            "articleContainer"
        );


    const news =
        Array.isArray(window.haberler)
            ? window.haberler
            : [];


    if (!news.length) {

        showError(
            "Haber verileri yüklenemedi."
        );

        return;

    }


    const pathname =
        window.location.pathname;

    const params =
        new URLSearchParams(
            window.location.search
        );


    let slug = "";

    let id = "";


    const pathMatch =
        pathname.match(
            /^\/haber\/([^\/]+)\/?$/i
        );


    if (pathMatch) {

        slug =
            decodeURIComponent(
                pathMatch[1]
            );

    }


    if (
        !slug &&
        params.get("slug")
    ) {

        slug =
            params.get("slug");

    }


    if (
        !slug &&
        params.get("haber")
    ) {

        const value =
            params.get("haber");


        if (
            /^\d+$/.test(value)
        ) {

            id = value;

        } else {

            slug = value;

        }

    }


    if (
        !slug &&
        !id &&
        params.get("haberId")
    ) {

        id =
            params.get("haberId");

    }


    if (
        !slug &&
        !id &&
        params.get("id")
    ) {

        id =
            params.get("id");

    }


    let haber = null;


    if (id) {

        haber =
            news.find(
                item =>
                    String(item.id)
                    ===
                    String(id)
            );

    }


    if (
        !haber &&
        slug
    ) {

        const temiz =
            slugify(slug);


        haber =
            news.find(
                item =>
                    slugify(
                        item.slug ||
                        item.baslik
                    )
                    ===
                    temiz
            );

    }


    if (!haber) {

        showError();

        return;

    }


    renderArticle(haber);


    /* =====================================================
       RENDER
    ===================================================== */

    function renderArticle(haber) {

        const baslik =
            haber.baslik ||
            haber.title ||
            "Haber";


        const kategori =
            haber.kategori ||
            haber.category ||
            "Haber";


        const tarih =
            haber.tarih ||
            haber.date ||
            "";


        const saat =
            haber.saat ||
            haber.time ||
            "";


        const okunma =
            haber.okunma ??
            haber.views ??
            "";


        const kaynak =
            haber.kaynak ||
            haber.source ||
            "Haberİsta";


        const spot =
            haber.spot ||
            haber.description ||
            "";


        const resim =
            haber.image ||
            haber.resim ||
            haber.gorsel ||
            haber["görsel"] ||
            haber.foto ||
            haber.fotograf ||
            haber.photo ||
            haber.thumbnail ||
            haber.img ||
            "";


        const icerik =
            haber.icerik ||
            haber.content ||
            "";


        document.title =
            baslik +
            " | Haberİsta";


        const imagePath =
            getImagePath(resim);


        container.innerHTML = `

            <div class="article-card">

                <header class="article-header">

                    <div class="article-category">

                        <span>
                            ${escapeHtml(kategori)}
                        </span>

                    </div>


                    <div class="article-title">

                        <h1>
                            ${escapeHtml(baslik)}
                        </h1>

                    </div>


                    ${
                        spot
                        ? `
                            <div class="article-spot">

                                <p>
                                    ${escapeHtml(spot)}
                                </p>

                            </div>
                        `
                        : ""
                    }


                    <div class="article-meta">

                        ${
                            tarih
                            ? `
                                <span>
                                    <strong>
                                        ${escapeHtml(tarih)}
                                    </strong>
                                </span>
                            `
                            : ""
                        }


                        ${
                            saat
                            ? `
                                <span
                                    class="meta-separator">
                                </span>

                                <span>
                                    ${escapeHtml(saat)}
                                </span>
                            `
                            : ""
                        }


                        ${
                            okunma !== ""
                            ? `
                                <span
                                    class="meta-separator">
                                </span>

                                <span>
                                    👁
                                    ${escapeHtml(
                                        String(okunma)
                                    )}
                                    okunma
                                </span>
                            `
                            : ""
                        }


                        <span
                            class="meta-separator">
                        </span>


                        <span
                            class="article-source-mini">

                            ${escapeHtml(kaynak)}

                        </span>

                    </div>

                </header>


                <div class="article-image-wrapper">

                    ${
                        imagePath
                        ? `
                            <img
                                class="article-image"
                                src="${escapeAttribute(imagePath)}"
                                alt="${escapeAttribute(baslik)}"
                                loading="eager"
                                onerror="this.style.display='none'"
                            >
                        `
                        : ""
                    }

                </div>


                <div class="image-caption">

                    Haberİsta · Haber görseli

                </div>


                <div class="article-body-layout">

                    <div
                        class="article-content"
                        id="articleContent"
                    ></div>


                    <aside class="article-sidebar">

                        <div class="sidebar-box">

                            <div class="sidebar-title">
                                HABERİSTA
                            </div>

                            <div class="sidebar-content">

                                <p>
                                    Türkiye ve dünyadan
                                    güncel gelişmeleri
                                    Haberİsta farkıyla
                                    takip edin.
                                </p>

                            </div>

                        </div>

                    </aside>

                </div>


                ${
                    kaynak
                    ? `
                        <div class="article-source">

                            <strong>
                                Kaynak:
                            </strong>

                            ${escapeHtml(kaynak)}

                        </div>
                    `
                    : ""
                }


                <div class="article-share">

                    <span class="share-title">
                        Haberi paylaş:
                    </span>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="shareNews()"
                        title="Paylaş"
                    >
                        ↗
                    </button>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="copyLink()"
                        title="Bağlantıyı kopyala"
                    >
                        🔗
                    </button>

                </div>


                <div class="article-end"></div>

            </div>

        `;


        const content =
            document.getElementById(
                "articleContent"
            );


        if (!icerik) {

            content.innerHTML = `
                <p>
                    Bu haber için henüz detaylı
                    içerik eklenmemiştir.
                </p>
            `;

            return;

        }


        if (
            /<[a-z][\s\S]*>/i.test(
                String(icerik)
            )
        ) {

            content.innerHTML =
                icerik;

        } else {

            content.innerHTML =
                String(icerik)
                    .split(/\n+/)
                    .map(
                        text =>
                            text.trim()
                    )
                    .filter(Boolean)
                    .map(
                        text =>
                            `<p>${escapeHtml(text)}</p>`
                    )
                    .join("");

        }

    }


    /* =====================================================
       SLUG
    ===================================================== */

    function slugify(text) {

        return String(text || "")
            .toLocaleLowerCase("tr-TR")
            .replace(/ğ/g, "g")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ç/g, "c")
            .replace(/â/g, "a")
            .replace(/î/g, "i")
            .replace(/û/g, "u")
            .replace(
                /[^a-z0-9\s-]/g,
                ""
            )
            .trim()
            .replace(
                /\s+/g,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                "");

    }


    /* =====================================================
       FOTOĞRAF
    ===================================================== */

    function getImagePath(src) {

        if (!src) return "";

        src =
            String(src).trim();


        if (
            src.startsWith("http://") ||
            src.startsWith("https://") ||
            src.startsWith("data:")
        ) {

            return src;

        }


        return "/" +
            src.replace(
                /^\/+/,
                ""
            );

    }


    /* =====================================================
       HTML GÜVENLİĞİ
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* =====================================================
       HATA
    ===================================================== */

    function showError(message) {

        container.innerHTML = `

            <div class="article-error">

                <div class="article-error-icon">
                    !
                </div>

                <h1>
                    Haber bulunamadı
                </h1>

                <p>
                    ${
                        message ||
                        "Aradığınız haber kaldırılmış veya bağlantı hatalı olabilir."
                    }
                </p>

                <button
                    onclick="window.location.href='/'"
                >
                    Ana Sayfaya Dön
                </button>

            </div>

        `;

    }

})();


/* =========================================================
   GERİ
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ) {

        history.back();

    } else {

        window.location.href = "/";

    }

}


/* =========================================================
   PAYLAŞ
========================================================= */

function shareNews() {

    const data = {

        title:
            document.title,

        text:
            document.title,

        url:
            window.location.href

    };


    if (
        navigator.share
    ) {

        navigator
            .share(data)
            .catch(
                () => {}
            );

    } else {

        copyLink();

    }

}


/* =========================================================
   KOPYALA
========================================================= */

function copyLink() {

    const url =
        window.location.href;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(url)
            .then(
                () => {
                    alert(
                        "Haber bağlantısı kopyalandı."
                    );
                }
            )
            .catch(
                () => {
                    alert(
                        "Bağlantı kopyalanamadı."
                    );
                }
            );

    } else {

        alert(
            "Bağlantı kopyalanamadı."
        );

    }

}

</script>
