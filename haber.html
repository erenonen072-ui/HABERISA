<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Haberİsta haber detay sayfası"
    >

    <meta name="theme-color" content="#e11d48">

    <title>Haberİsta</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/haber.css"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #111827;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           SAYFA
        ===================================================== */

        .article-page {
            min-height: 100vh;
            padding: 22px 16px 70px;
        }

        .article-wrapper {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        /* =====================================================
           ÜST BAR
        ===================================================== */

        .article-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            height: 64px;
            margin-bottom: 18px;

            padding: 0 4px;
        }

        .article-logo {
            display: inline-flex;
            align-items: center;

            text-decoration: none;

            font-size: 30px;
            font-weight: 900;

            color: #111827;

            letter-spacing: -1.5px;
        }

        .article-logo span {
            color: #e11d48;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            border: 1px solid #e5e7eb;

            background: #fff;
            color: #374151;

            padding: 10px 16px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .back-button:hover {
            background: #f9fafb;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(0,0,0,.08);
        }

        /* =====================================================
           HABER ANA KART
        ===================================================== */

        .article-card {
            background: #fff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(15,23,42,.06);
        }

        /* =====================================================
           HABER ÜST BÖLÜMÜ
        ===================================================== */

        .article-header {
            padding: 34px 44px 30px;
        }

        /* =====================================================
           KATEGORİ
        ===================================================== */

        .article-category {
            margin-bottom: 18px;
        }

        .article-category span {
            display: inline-flex;
            align-items: center;

            background: #e11d48;
            color: #fff;

            padding: 7px 12px;

            border-radius: 5px;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .6px;
        }

        /* =====================================================
           BAŞLIK
        ===================================================== */

        .article-title {
            margin: 0;
        }

        .article-title h1 {
            margin: 0;

            max-width: 1050px;

            font-size:
                clamp(32px, 5vw, 54px);

            line-height: 1.08;

            letter-spacing: -1.8px;

            font-weight: 900;

            color: #111827;
        }

        /* =====================================================
           SPOT
        ===================================================== */

        .article-spot {
            margin-top: 20px;
        }

        .article-spot p {
            max-width: 930px;

            margin: 0;

            color: #4b5563;

            font-size: 19px;

            line-height: 1.6;

            font-weight: 500;
        }

        /* =====================================================
           META
        ===================================================== */

        .article-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 8px 14px;

            margin-top: 23px;

            color: #6b7280;

            font-size: 13px;
        }

        .article-meta strong {
            color: #374151;
        }

        .meta-separator {
            width: 4px;
            height: 4px;

            background: #cbd5e1;

            border-radius: 50%;
        }

        .article-source-mini {
            font-weight: 700;
            color: #6b7280;
        }

        /* =====================================================
           FOTOĞRAF
        ===================================================== */

        .article-image-wrapper {
            position: relative;

            width: 100%;

            background: #e5e7eb;

            overflow: hidden;
        }

        .article-image {
            display: block;

            width: 100%;

            height: auto;

            min-height: 300px;

            max-height: 680px;

            object-fit: cover;

            object-position: center;

            background: #e5e7eb;
        }

        /* =====================================================
           FOTOĞRAF ALTI
        ===================================================== */

        .image-caption {
            padding: 9px 44px;

            background: #fafafa;

            border-bottom:
                1px solid #e5e7eb;

            color: #9ca3af;

            font-size: 12px;
        }

        /* =====================================================
           İÇERİK ALANI
        ===================================================== */

        .article-body-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 850px)
                250px;

            gap: 45px;

            justify-content: center;

            padding: 40px 44px 50px;
        }

        /* =====================================================
           HABER İÇERİĞİ
        ===================================================== */

        .article-content {
            min-width: 0;
        }

        .article-content p {
            margin:
                0 0 25px;

            color: #1f2937;

            font-size: 18px;

            line-height: 1.9;
        }

        .article-content p:first-child {
            font-size: 19px;
            color: #111827;
        }

        .article-content h2 {
            margin:
                42px 0 18px;

            color: #111827;

            font-size: 29px;

            line-height: 1.25;

            font-weight: 850;

            letter-spacing: -.5px;
        }

        .article-content h3 {
            margin:
                32px 0 15px;

            color: #111827;

            font-size: 23px;

            line-height: 1.3;
        }

        .article-content strong {
            color: #111827;
        }

        .article-content ul,
        .article-content ol {
            margin:
                20px 0 28px;

            padding-left: 28px;
        }

        .article-content li {
            margin-bottom: 11px;

            color: #374151;

            font-size: 17px;

            line-height: 1.7;
        }

        .article-content blockquote {
            margin:
                32px 0;

            padding:
                20px 24px;

            background: #f9fafb;

            border-left:
                4px solid #e11d48;

            border-radius:
                0 8px 8px 0;

            color: #4b5563;

            font-size: 18px;

            line-height: 1.7;
        }

        /* =====================================================
           YAN BİLGİ ALANI
        ===================================================== */

        .article-sidebar {
            align-self: start;

            position: sticky;

            top: 20px;
        }

        .sidebar-box {
            background: #f9fafb;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            overflow: hidden;
        }

        .sidebar-title {
            padding:
                15px 16px;

            border-bottom:
                1px solid #e5e7eb;

            font-size: 14px;

            font-weight: 800;

            color: #111827;
        }

        .sidebar-content {
            padding: 15px 16px;
        }

        .sidebar-content p {
            margin: 0;

            color: #6b7280;

            font-size: 13px;

            line-height: 1.7;
        }

        /* =====================================================
           KAYNAK
        ===================================================== */

        .article-source {
            margin:
                0 44px 30px;

            padding:
                16px 18px;

            background: #f8fafc;

            border:
                1px solid #e2e8f0;

            border-radius: 9px;

            color: #64748b;

            font-size: 13px;
        }

        .article-source strong {
            color: #334155;
        }

        /* =====================================================
           PAYLAŞIM
        ===================================================== */

        .article-share {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 9px;

            padding:
                0 44px 40px;
        }

        .share-title {
            margin-right: 6px;

            color: #4b5563;

            font-size: 13px;

            font-weight: 800;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;

            border:
                1px solid #e5e7eb;

            border-radius: 50%;

            background: #fff;

            color: #374151;

            cursor: pointer;

            font-size: 16px;

            transition:
                .2s ease;
        }

        .share-btn:hover {
            background: #f3f4f6;

            transform:
                translateY(-2px);
        }

        /* =====================================================
           HABER SONU
        ===================================================== */

        .article-end {
            height: 1px;

            margin:
                0 44px;

            background: #e5e7eb;
        }

        /* =====================================================
           ALT KISIM
        ===================================================== */

        .article-footer {
            text-align: center;

            padding:
                28px 10px 0;

            color: #9ca3af;

            font-size: 12px;
        }

        /* =====================================================
           YÜKLENİYOR
        ===================================================== */

        .article-loading {
            min-height: 65vh;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #6b7280;

            font-size: 16px;
        }

        /* =====================================================
           HATA
        ===================================================== */

        .article-error {
            padding:
                80px 25px;

            text-align: center;

            background: #fff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(15,23,42,.06);
        }

        .article-error-icon {
            width: 60px;
            height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 20px;

            background: #fff1f2;

            color: #e11d48;

            border-radius: 50%;

            font-size: 25px;
        }

        .article-error h1 {
            margin:
                0 0 10px;

            color: #111827;

            font-size: 32px;
        }

        .article-error p {
            margin:
                0 auto 25px;

            max-width: 500px;

            color: #6b7280;

            line-height: 1.6;
        }

        .article-error button {
            border: 0;

            background: #e11d48;

            color: #fff;

            padding:
                12px 21px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 900px) {

            .article-body-layout {
                grid-template-columns: 1fr;

                gap: 25px;
            }

            .article-sidebar {
                position: static;

                order: 2;
            }

        }

        @media (max-width: 700px) {

            .article-page {
                padding:
                    10px 8px 40px;
            }

            .article-top {
                height: 55px;

                margin-bottom: 10px;
            }

            .article-logo {
                font-size: 23px;
            }

            .back-button {
                padding:
                    8px 11px;

                font-size: 12px;
            }

            .article-card {
                border-radius: 12px;
            }

            .article-header {
                padding:
                    24px 18px 23px;
            }

            .article-category {
                margin-bottom: 14px;
            }

            .article-category span {
                padding:
                    6px 9px;

                font-size: 10px;
            }

            .article-title h1 {
                font-size: 31px;

                line-height: 1.12;

                letter-spacing:
                    -1px;
            }

            .article-spot {
                margin-top: 15px;
            }

            .article-spot p {
                font-size: 16px;

                line-height: 1.55;
            }

            .article-meta {
                margin-top: 18px;

                font-size: 11px;
            }

            .article-image {
                min-height: 210px;

                max-height: 430px;
            }

            .image-caption {
                padding:
                    8px 18px;

                font-size: 10px;
            }

            .article-body-layout {
                padding:
                    27px 18px 35px;
            }

            .article-content p {
                font-size: 16px;

                line-height: 1.8;

                margin-bottom: 21px;
            }

            .article-content p:first-child {
                font-size: 17px;
            }

            .article-content h2 {
                margin-top: 34px;

                font-size: 24px;
            }

            .article-content h3 {
                font-size: 20px;
            }

            .article-content li {
                font-size: 15px;
            }

            .article-content blockquote {
                padding:
                    16px 18px;

                font-size: 16px;
            }

            .article-source {
                margin:
                    0 18px 25px;

                padding:
                    14px 15px;

                font-size: 12px;
            }

            .article-share {
                padding:
                    0 18px 28px;
            }

            .article-end {
                margin:
                    0 18px;
            }

            .article-footer {
                padding-top: 22px;
            }

        }

    </style>
</head>

<body>

<main class="article-page">

    <div class="article-wrapper">

        <!-- =================================================
             ÜST BAR
        ================================================== -->

        <div class="article-top">

            <a
                href="/"
                class="article-logo"
                aria-label="Haberİsta Ana Sayfa"
            >
                <span>Haber</span>İsta
            </a>

            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ← Geri
            </button>

        </div>


        <!-- =================================================
             HABER
        ================================================== -->

        <article id="articleContainer">

            <div class="article-loading">
                Haber yükleniyor...
            </div>

        </article>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="article-footer">
            © 2026 Haberİsta · Tüm hakları saklıdır.
        </div>

    </div>

</main>


<!-- =========================================================
     HABER VERİLERİ
========================================================= -->

<script src="/js/haberler.js"></script>


<script>

(function () {

    "use strict";


    /* =====================================================
       CONTAINER
    ===================================================== */

    const container =
        document.getElementById(
            "articleContainer"
        );


    /* =====================================================
       HABERLER
    ===================================================== */

    const news =
        Array.isArray(window.haberler)
            ? window.haberler
            : [];


    console.log(
        "Haberİsta haber sayısı:",
        news.length
    );


    console.log(
        "Mevcut URL:",
        window.location.href
    );


    if (!news.length) {

        console.error(
            "haberler.js yüklenemedi."
        );

        showError(
            "Haber verileri yüklenemedi."
        );

        return;
    }


    /* =====================================================
       URL
    ===================================================== */

    const pathname =
        window.location.pathname;

    const params =
        new URLSearchParams(
            window.location.search
        );


    let slug = "";

    let id = "";


    /* =====================================================
       /haber/baslik
    ===================================================== */

    const pathMatch =
        pathname.match(
            /^\/haber\/([^\/]+)\/?$/i
        );


    if (pathMatch) {

        slug =
            decodeURIComponent(
                pathMatch[1]
            );

    }


    /* =====================================================
       ?slug=
    ===================================================== */

    if (
        !slug &&
        params.get("slug")
    ) {

        slug =
            params.get("slug");

    }


    /* =====================================================
       ?haber=
    ===================================================== */

    if (
        !slug &&
        params.get("haber")
    ) {

        const haberParam =
            params.get("haber");


        if (
            /^\d+$/.test(
                haberParam
            )
        ) {

            id = haberParam;

        } else {

            slug = haberParam;

        }

    }


    /* =====================================================
       ?haberId=
    ===================================================== */

    if (
        !slug &&
        !id &&
        params.get("haberId")
    ) {

        id =
            params.get("haberId");

    }


    /* =====================================================
       ?id=
    ===================================================== */

    if (
        !slug &&
        !id &&
        params.get("id")
    ) {

        id =
            params.get("id");

    }


    console.log(
        "Slug:",
        slug
    );

    console.log(
        "ID:",
        id
    );


    /* =====================================================
       HABERİ BUL
    ===================================================== */

    let haber = null;


    /* ID */

    if (id) {

        haber =
            news.find(
                function (item) {

                    return String(
                        item.id
                    ) === String(id);

                }
            );

    }


    /* SLUG */

    if (
        !haber &&
        slug
    ) {

        const temizSlug =
            slugify(slug);


        haber =
            news.find(
                function (item) {

                    if (
                        item.slug
                    ) {

                        return (
                            slugify(
                                item.slug
                            ) ===
                            temizSlug
                        );

                    }


                    return (
                        slugify(
                            item.baslik
                        ) ===
                        temizSlug
                    );

                }
            );

    }


    /* BAŞLIKTAN */

    if (
        !haber &&
        slug
    ) {

        haber =
            news.find(
                function (item) {

                    return (
                        slugify(
                            item.baslik
                        ) ===
                        slugify(slug)
                    );

                }
            );

    }


    /* =====================================================
       HABER YOK
    ===================================================== */

    if (!haber) {

        console.error(
            "HABER BULUNAMADI",
            {
                slug,
                id,
                news
            }
        );

        showError();

        return;
    }


    console.log(
        "Haber bulundu:",
        haber
    );


    /* =====================================================
       RENDER
    ===================================================== */

    renderArticle(haber);


    /* =====================================================
       HABER OLUŞTUR
    ===================================================== */

    function renderArticle(haber) {

        const baslik =
            haber.baslik ||
            haber.title ||
            "Haber";


        const kategori =
            haber.kategori ||
            haber.category ||
            "Haber";


        const tarih =
            haber.tarih ||
            haber.date ||
            "";


        const saat =
            haber.saat ||
            haber.time ||
            "";


        const okunma =
            haber.okunma ??
            haber.views ??
            "";


        const kaynak =
            haber.kaynak ||
            haber.source ||
            "Haberİsta";


        const spot =
            haber.spot ||
            haber.description ||
            "";


        const resim =
            haber.image ||
            haber.resim ||
            haber.gorsel ||
            haber["görsel"] ||
            haber.foto ||
            haber.fotograf ||
            haber.photo ||
            haber.thumbnail ||
            haber.img ||
            "";


        const icerik =
            haber.icerik ||
            haber.content ||
            "";


        /* =================================================
           TITLE
        ================================================= */

        document.title =
            baslik +
            " | Haberİsta";


        /* =================================================
           META DESCRIPTION
        ================================================= */

        let metaDescription =
            document.querySelector(
                'meta[name="description"]'
            );


        if (!metaDescription) {

            metaDescription =
                document.createElement(
                    "meta"
                );

            metaDescription.name =
                "description";

            document.head.appendChild(
                metaDescription
            );

        }


        metaDescription.content =
            spot ||
            baslik;


        /* =================================================
           FOTOĞRAF
        ================================================= */

        const imagePath =
            getImagePath(resim);


        /* =================================================
           HTML
        ================================================= */

        container.innerHTML = `

            <div class="article-card">


                <!-- ================================
                     HABER BAŞLIĞI
                ================================= -->

                <header class="article-header">


                    <div class="article-category">

                        <span>
                            ${escapeHtml(kategori)}
                        </span>

                    </div>


                    <div class="article-title">

                        <h1>
                            ${escapeHtml(baslik)}
                        </h1>

                    </div>


                    ${
                        spot
                        ? `

                            <div class="article-spot">

                                <p>
                                    ${escapeHtml(spot)}
                                </p>

                            </div>

                        `
                        : ""
                    }


                    <div class="article-meta">


                        ${
                            tarih
                            ? `

                                <span>
                                    <strong>
                                        ${escapeHtml(tarih)}
                                    </strong>
                                </span>

                            `
                            : ""
                        }


                        ${
                            saat
                            ? `

                                <span
                                    class="meta-separator">
                                </span>

                                <span>
                                    ${escapeHtml(saat)}
                                </span>

                            `
                            : ""
                        }


                        ${
                            okunma !== ""
                            ? `

                                <span
                                    class="meta-separator">
                                </span>

                                <span>
                                    👁
                                    ${escapeHtml(
                                        String(okunma)
                                    )}
                                    okunma
                                </span>

                            `
                            : ""
                        }


                        <span
                            class="meta-separator">
                        </span>


                        <span
                            class="article-source-mini">
                            ${escapeHtml(kaynak)}
                        </span>


                    </div>


                </header>


                <!-- ================================
                     FOTOĞRAF
                ================================= -->

                <div class="article-image-wrapper">

                    <img
                        class="article-image"
                        src="${escapeAttribute(imagePath)}"
                        alt="${escapeAttribute(baslik)}"
                        loading="eager"
                        onerror="handleImageError(this)"
                    >

                </div>


                <div class="image-caption">
                    Haberİsta · Haber görseli
                </div>


                <!-- ================================
                     İÇERİK
                ================================= -->

                <div class="article-body-layout">


                    <div
                        class="article-content"
                        id="articleContent"
                    >
                    </div>


                    <!-- ============================
                         YAN BİLGİ
                    ============================= -->

                    <aside class="article-sidebar">

                        <div class="sidebar-box">

                            <div class="sidebar-title">
                                Haber Hakkında
                            </div>

                            <div class="sidebar-content">

                                <p>
                                    Haberİsta, Türkiye ve
                                    dünyadan güncel
                                    gelişmeleri okuyucularına
                                    aktarmaktadır.
                                </p>

                            </div>

                        </div>

                    </aside>


                </div>


                <!-- ================================
                     KAYNAK
                ================================= -->

                ${
                    kaynak
                    ? `

                        <div class="article-source">

                            <strong>
                                Kaynak:
                            </strong>

                            ${escapeHtml(kaynak)}

                        </div>

                    `
                    : ""
                }


                <!-- ================================
                     PAYLAŞ
                ================================= -->

                <div class="article-share">

                    <span class="share-title">
                        Haberi paylaş
                    </span>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="shareNews()"
                        title="Haberi paylaş"
                        aria-label="Haberi paylaş"
                    >
                        ↗
                    </button>


                    <button
                        type="button"
                        class="share-btn"
                        onclick="copyLink()"
                        title="Bağlantıyı kopyala"
                        aria-label="Bağlantıyı kopyala"
                    >
                        🔗
                    </button>

                </div>


                <div class="article-end"></div>


            </div>

        `;


        /* =================================================
           İÇERİK
        ================================================= */

        const contentBox =
            document.getElementById(
                "articleContent"
            );


        if (!icerik) {

            contentBox.innerHTML = `

                <p>
                    Bu haber için henüz detaylı
                    içerik eklenmemiştir.
                </p>

            `;

            return;
        }


        /* =================================================
           HTML İÇERİK
        ================================================= */

        if (
            /<[a-z][\s\S]*>/i.test(
                String(icerik)
            )
        ) {

            contentBox.innerHTML =
                icerik;

        } else {

            const paragraphs =
                String(icerik)
                    .split(/\n+/)
                    .map(
                        text =>
                            text.trim()
                    )
                    .filter(Boolean);


            contentBox.innerHTML =
                paragraphs
                    .map(
                        function (text) {

                            return `

                                <p>
                                    ${escapeHtml(text)}
                                </p>

                            `;

                        }
                    )
                    .join("");

        }

    }


    /* =====================================================
       SLUG
    ===================================================== */

    function slugify(text) {

        return String(text || "")

            .toLocaleLowerCase(
                "tr-TR"
            )

            .replace(/ğ/g, "g")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ç/g, "c")

            .replace(/â/g, "a")
            .replace(/î/g, "i")
            .replace(/û/g, "u")

            .replace(
                /[^a-z0-9\s-]/g,
                ""
            )

            .trim()

            .replace(
                /\s+/g,
                "-"
            )

            .replace(
                /-+/g,
                "-"
            )

            .replace(
                /^-+|-+$/g,
                "");

    }


    /* =====================================================
       FOTOĞRAF YOLU
    ===================================================== */

    function getImagePath(src) {

        if (!src) {

            return "";

        }


        src =
            String(src).trim();


        /* HARİCİ */

        if (
            src.startsWith(
                "http://"
            ) ||

            src.startsWith(
                "https://"
            ) ||

            src.startsWith(
                "data:"
            )
        ) {

            return src;

        }


        /* LOCAL */

        return "/" +
            src.replace(
                /^\/+/,
                ""
            );

    }


    /* =====================================================
       FOTOĞRAF HATASI
    ===================================================== */

    window.handleImageError =
        function (image) {

            console.error(
                "Fotoğraf yüklenemedi:",
                image.src
            );


            image.onerror = null;


            image.style.display =
                "none";

        };


    /* =====================================================
       HTML GÜVENLİĞİ
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* =====================================================
       HATA
    ===================================================== */

    function showError(message) {

        container.innerHTML = `

            <div class="article-error">


                <div class="article-error-icon">
                    !
                </div>


                <h1>
                    Haber bulunamadı
                </h1>


                <p>
                    ${
                        message ||
                        "Aradığınız haber kaldırılmış veya bağlantı hatalı olabilir."
                    }
                </p>


                <button
                    type="button"
                    onclick="window.location.href='/'"
                >
                    Ana Sayfaya Dön
                </button>


            </div>

        `;

    }

})();


/* =========================================================
   GERİ
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ) {

        history.back();

    } else {

        window.location.href = "/";

    }

}


/* =========================================================
   PAYLAŞ
========================================================= */

function shareNews() {

    const data = {

        title:
            document.title,

        text:
            document.title,

        url:
            window.location.href

    };


    if (
        navigator.share
    ) {

        navigator
            .share(data)
            .catch(
                () => {}
            );

    } else {

        copyLink();

    }

}


/* =========================================================
   LİNK KOPYALA
========================================================= */

function copyLink() {

    const url =
        window.location.href;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(url)

            .then(
                function () {

                    alert(
                        "Haber bağlantısı kopyalandı."
                    );

                }
            )

            .catch(
                function () {

                    fallbackCopy(url);

                }
            );

    } else {

        fallbackCopy(url);

    }

}


/* =========================================================
   YEDEK KOPYALAMA
========================================================= */

function fallbackCopy(text) {

    const input =
        document.createElement(
            "textarea"
        );


    input.value = text;

    input.style.position =
        "fixed";

    input.style.opacity =
        "0";


    document.body.appendChild(
        input
    );


    input.select();


    try {

        document.execCommand(
            "copy"
        );

        alert(
            "Haber bağlantısı kopyalandı."
        );

    } catch (error) {

        alert(
            "Bağlantı kopyalanamadı."
        );

    }


    document.body.removeChild(
        input
    );

}

</script>
